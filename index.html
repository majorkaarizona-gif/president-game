<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mr. President! Full 3D Edition</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: 'Montserrat', sans-serif;
    }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
    }
    #canvas-container {
      width: 100vw; height: 100vh;
      position: absolute; top: 0; left: 0;
    }

    /* Подсказка поворота экрана */
    #rotate-hint {
      display: none;
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0b0f19; z-index: 999;
      flex-direction: column; justify-content: center; align-items: center;
      text-align: center; padding: 20px;
    }
    #rotate-hint svg {
      width: 60px; height: 60px; margin-bottom: 12px;
      animation: rot 2s infinite ease-in-out;
    }
    @keyframes rot {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
    }
    @media screen and (orientation: portrait) {
      #rotate-hint { display: flex; }
    }

    /* UI Элементы */
    .ui-top {
      position: absolute; top: 12px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10; pointer-events: none;
    }
    .badge {
      background: #dc2626; color: #fff;
      font-size: 14px; font-weight: 900; font-style: italic;
      padding: 6px 14px; transform: skew(-10deg);
      box-shadow: 3px 3px 0px #000; border: 2px solid #fff;
      text-transform: uppercase;
    }
    .badge-yellow { background: #f59e0b; color: #000; }
    .badge-blue { background: #2563eb; }

    /* Джойстик управления */
    #joystick-zone {
      position: absolute; bottom: 30px; left: 30px;
      width: 120px; height: 120px;
      background: rgba(255,255,255,0.15);
      border: 3px solid rgba(255,255,255,0.5);
      border-radius: 50%;
      z-index: 15; touch-action: none;
    }
    #joystick-knob {
      position: absolute; top: 35px; left: 35px;
      width: 50px; height: 50px;
      background: #f59e0b; border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    /* Кнопка Прыжка / Броска */
    #dive-btn {
      position: absolute; bottom: 35px; right: 35px;
      width: 90px; height: 90px;
      background: #dc2626; border: 3px solid #fff;
      border-radius: 50%; color: #fff;
      font-size: 16px; font-weight: 900; font-style: italic;
      box-shadow: 4px 4px 0px #000;
      z-index: 15; display: flex; justify-content: center; align-items: center;
      text-transform: uppercase; transform: skew(-5deg);
      cursor: pointer;
    }
    #dive-btn:active {
      transform: scale(0.95) skew(-5deg);
      background: #b91c1c;
    }

    /* Экраны Победы / Поражения */
    .game-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 8, 15, 0.92);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 20; backdrop-filter: blur(4px);
    }
    .screen-title {
      font-size: 28px; font-weight: 900; font-style: italic;
      text-transform: uppercase; padding: 10px 28px;
      transform: skew(-10deg); box-shadow: 5px 5px 0px #000;
      margin-bottom: 15px; border: 3px solid #fff;
    }
    .title-win { background: #16a34a; color: #fff; }
    .title-fail { background: #dc2626; color: #fff; }
    .title-start { background: #2563eb; color: #fff; }

    .btn-action {
      background: #f59e0b; color: #000; border: 3px solid #fff;
      padding: 12px 36px; font-size: 18px; font-weight: 900; font-style: italic;
      text-transform: uppercase; transform: skew(-10deg);
      box-shadow: 4px 4px 0px #000; cursor: pointer;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="rotate-hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><path d="M12 8v8"></path></svg>
    <p style="font-weight: 900; font-size: 18px; color: #fff;">ПЕРЕВЕРНИТЕ ТЕЛЕФОН</p>
    <p style="font-size: 12px; color: #94a3b8; margin-top: 5px;">Включите альбомный режим для игры</p>
  </div>

  <div id="canvas-container"></div>

  <div class="ui-top">
    <div class="badge badge-blue" id="stage-badge">STAGE 1</div>
    <div class="badge badge-yellow" id="timer-badge">3.0s</div>
    <div class="badge" id="score-badge">SAVED: 0</div>
  </div>

  <!-- Джойстик и кнопка прыжка -->
  <div id="joystick-zone">
    <div id="joystick-knob"></div>
  </div>
  <div id="dive-btn">DIVE!</div>

  <!-- Экран старта / результатов -->
  <div id="overlay-screen" class="game-screen">
    <div class="screen-title title-start" id="screen-title">MR. PRESIDENT!</div>
    <p style="font-size: 14px; margin-bottom: 20px; color: #cbd5e1; text-align: center; max-width: 400px;" id="screen-desc">
      Бегите джойстиком во все стороны, сносите конструкции и нажимайте DIVE, чтобы закрыть Президента Рональда Рампа от снайпера!
    </p>
    <button class="btn-action" onclick="startStage()">ПОГНАЛИ!</button>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }

    let scene, camera, renderer, world;
    let stage = 1, savedCount = 0;
    let gameState = 'START';
    let countdown = 3.0;
    let timeScale = 1.0;

    let guardMesh, guardBody;
    let rumpMesh, rumpBody;
    let bulletMesh, bulletBody;
    let sniperLine;

    let destructibleObjects = [];

    // Джойстик переменные
    let joyMove = { x: 0, y: 0 };
    let joyActive = false;
    let joyTouchId = null;

    function init3D() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);
      scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      world = new CANNON.World();
      world.gravity.set(0, -9.82, 0);

      createStaticEnvironment();
      setupJoystickControls();

      animate();
    }

    function createStaticEnvironment() {
      // Пол сцены
      const floorGeo = new THREE.PlaneGeometry(40, 50);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x881337, roughness: 0.7 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
      floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
      world.addBody(floorBody);

      // Красная дорожка в центре
      const rugGeo = new THREE.PlaneGeometry(6, 40);
      const rugMat = new THREE.MeshStandardMaterial({ color: 0xb91c1c });
      const rug = new THREE.Mesh(rugGeo, rugMat);
      rug.rotation.x = -Math.PI / 2;
      rug.position.y = 0.01;
      scene.add(rug);

      // Лазер снайпера
      const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
      const laserMat = new THREE.LineBasicMaterial({ color: 0xef4444, linewidth: 3 });
      sniperLine = new THREE.Line(laserGeo, laserMat);
      scene.add(sniperLine);
    }

    // Создание Персонажей: Дик Джонсон и Рональд Рамп
    function createCharacters() {
      if (guardMesh) { scene.remove(guardMesh); world.remove(guardBody); }
      if (rumpMesh) { scene.remove(rumpMesh); world.remove(rumpBody); }

      // 1. Телохранитель (Игрок)
      const gGroup = new THREE.Group();
      const gSuit = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.3, 0.5), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
      gSuit.position.y = 0.65;
      gSuit.castShadow = true;
      gGroup.add(gSuit);

      const gHead = new THREE.Mesh(new THREE.SphereGeometry(0.25, 12, 12), new THREE.MeshStandardMaterial({ color: 0xf3d2c1 }));
      gHead.position.y = 1.4;
      gGroup.add(gHead);

      scene.add(gGroup);

      const gShape = new CANNON.Box(new CANNON.Vec3(0.4, 0.65, 0.25));
      guardBody = new CANNON.Body({ mass: 80, shape: gShape });
      guardBody.position.set(0, 0.65, 8); // Начинает внизу карты
      guardBody.fixedRotation = true; // Чтобы стоял ровно пока бежит
      guardBody.updateMassProperties();
      world.addBody(guardBody);
      guardMesh = gGroup;

      // 2. Президент Рональд Рамп
      const rGroup = new THREE.Group();
      const rSuit = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 1.2, 12), new THREE.MeshStandardMaterial({ color: 0x1e3a8a }));
      rSuit.position.y = 0.6;
      rSuit.castShadow = true;
      rGroup.add(rSuit);

      // Прическа Рампа (Ярко-желтая)
      const rHair = new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 12), new THREE.MeshStandardMaterial({ color: 0xfacc15 }));
      rHair.position.y = 1.35;
      rHair.scale.set(1.2, 0.7, 1.3);
      rGroup.add(rHair);

      scene.add(rGroup);

      const rShape = new CANNON.Cylinder(0.35, 0.35, 1.2, 8);
      rumpBody = new CANNON.Body({ mass: 70, shape: rShape });
      rumpBody.position.set(0, 0.6, -6); // Стоит на трибуне вверху
      world.addBody(rumpBody);
      rumpMesh = rGroup;
    }

    // Создание карты с разрушаемыми коробками/колоннами (карозия/падения)
    function buildStageMap(stageNum) {
      destructibleObjects.forEach(o => { scene.remove(o.mesh); world.remove(o.body); });
      destructibleObjects = [];

      const boxGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
      const boxMat = new THREE.MeshStandardMaterial({ color: 0xd97706 });

      // Строим разрушаемые стены/колонны перед Рампом
      const rows = Math.min(2 + stageNum, 5);
      const cols = 5;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const mesh = new THREE.Mesh(boxGeo, boxMat);
          mesh.castShadow = true;
          scene.add(mesh);

          const shape = new CANNON.Box(new CANNON.Vec3(0.4, 0.4, 0.4));
          const body = new CANNON.Body({ mass: 5, shape });
          const posX = (c - 2) * 0.9;
          const posY = 0.4 + r * 0.85;
          const posZ = 0; // Посередине между игроком и снайпером

          body.position.set(posX, posY, posZ);
          world.addBody(body);

          destructibleObjects.push({ mesh, body });
        }
      }
    }

    // Управление Джойстиком
    function setupJoystickControls() {
      const zone = document.getElementById('joystick-zone');
      const knob = document.getElementById('joystick-knob');
      const diveBtn = document.getElementById('dive-btn');

      const handleTouchStart = (e) => {
        const t = e.changedTouches[0];
        joyTouchId = t.identifier;
        joyActive = true;
        updateKnob(t.clientX, t.clientY);
      };

      const handleTouchMove = (e) => {
        if (!joyActive) return;
        for (let t of e.changedTouches) {
          if (t.identifier === joyTouchId) {
            updateKnob(t.clientX, t.clientY);
            break;
          }
        }
      };

      const handleTouchEnd = (e) => {
        for (let t of e.changedTouches) {
          if (t.identifier === joyTouchId) {
            joyActive = false;
            joyMove = { x: 0, y: 0 };
            knob.style.left = '35px';
            knob.style.top = '35px';
            break;
          }
        }
      };

      function updateKnob(cx, cy) {
        const rect = zone.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        let dx = cx - centerX;
        let dy = cy - centerY;
        const dist = Math.hypot(dx, dy);
        const maxR = 40;

        if (dist > maxR) {
          dx = (dx / dist) * maxR;
          dy = (dy / dist) * maxR;
        }

        knob.style.left = `${35 + dx}px`;
        knob.style.top = `${35 + dy}px`;

        joyMove.x = dx / maxR;
        joyMove.y = dy / maxR;
      }

      zone.addEventListener('touchstart', handleTouchStart);
      window.addEventListener('touchmove', handleTouchMove);
      window.addEventListener('touchend', handleTouchEnd);

      // Кнопка DIVE / Прыжок регдоллом
      diveBtn.addEventListener('click', performDive);
      diveBtn.addEventListener('touchstart', (e) => { e.preventDefault(); performDive(); });
    }

    function performDive() {
      if (gameState !== 'PLAYING') return;

      guardBody.fixedRotation = false; // Включаем регдолл-физику вращения
      guardBody.updateMassProperties();

      const forwardX = joyMove.x * 15;
      const forwardZ = (joyMove.y !== 0 ? joyMove.y : -1) * 18;

      guardBody.velocity.set(forwardX, 7, forwardZ);
      guardBody.angularVelocity.set(Math.random()*10, Math.random()*10, Math.random()*10);

      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
    }

    function startStage() {
      createCharacters();
      buildStageMap(stage);

      countdown = Math.max(1.8, 3.2 - stage * 0.15).toFixed(1);
      gameState = 'PLAYING';
      timeScale = 1.0;

      if (bulletMesh) { scene.remove(bulletMesh); world.remove(bulletBody); bulletMesh = null; }

      document.getElementById('stage-badge').innerText = `STAGE ${stage}`;
      document.getElementById('overlay-screen').classList.add('hidden');
    }

    function shootSniperBullet() {
      gameState = 'SHOT';

      const bulletGeo = new THREE.SphereGeometry(0.18, 8, 8);
      const bulletMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
      bulletMesh = new THREE.Mesh(bulletGeo, bulletMat);
      scene.add(bulletMesh);

      const startPos = new THREE.Vector3(10, 5, -18);
      const targetPos = rumpMesh.position.clone();
      const dir = targetPos.clone().sub(startPos).normalize();

      bulletBody = new CANNON.Body({ mass: 0.2, shape: new CANNON.Sphere(0.18) });
      bulletBody.position.set(startPos.x, startPos.y, startPos.z);
      bulletBody.velocity.set(dir.x * 38, dir.y * 38, dir.z * 38);
      world.addBody(bulletBody);
    }

    function updatePhysicsAndGame() {
      const dt = (1 / 60) * timeScale;
      world.step(dt);

      // Движение игрока от джойстика
      if (gameState === 'PLAYING' && guardBody.fixedRotation) {
        const speed = 8;
        guardBody.velocity.x = joyMove.x * speed;
        guardBody.velocity.z = joyMove.y * speed;
      }

      // Синхронизация трехмерных моделей
      if (guardMesh) { guardMesh.position.copy(guardBody.position); guardMesh.quaternion.copy(guardBody.quaternion); }
      if (rumpMesh) { rumpMesh.position.copy(rumpBody.position); rumpMesh.quaternion.copy(rumpBody.quaternion); }

      destructibleObjects.forEach(d => {
        d.mesh.position.copy(d.body.position);
        d.mesh.quaternion.copy(d.body.quaternion);
      });

      // Камера следит за телохранителем
      if (guardMesh) {
        camera.position.x = guardMesh.position.x * 0.5;
        camera.position.z = guardMesh.position.z + 8;
        camera.position.y = 5;
        camera.lookAt(guardMesh.position.x, 1, guardMesh.position.z - 3);
      }

      // Лазер снайпера
      if (gameState === 'PLAYING' && rumpMesh) {
        sniperLine.geometry.setFromPoints([new THREE.Vector3(10, 5, -18), rumpMesh.position]);
      } else {
        sniperLine.visible = false;
      }

      // Проверка попадений пули
      if (bulletMesh && bulletBody) {
        bulletMesh.position.copy(bulletBody.position);

        if (bulletMesh.position.distanceTo(guardMesh.position) < 1.0) {
          winStage("ВЫ СПАСЛИ ПРЕЗИДЕНТА!");
          return;
        }
        if (bulletMesh.position.distanceTo(rumpMesh.position) < 0.8) {
          failStage("ПРЕЗИДЕНТ РАМП УБИТ!");
          return;
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      if (gameState === 'PLAYING') {
        countdown -= 1 / 60;
        document.getElementById('timer-badge').innerText = Math.max(0, countdown).toFixed(1) + "s";

        if (countdown <= 0.8) timeScale = 0.3; // Слоу-мо при подлете пули

        if (countdown <= 0) {
          shootSniperBullet();
        }
      }

      updatePhysicsAndGame();
      renderer.render(scene, camera);
    }

    function winStage(msg) {
      gameState = 'WIN';
      savedCount++;
      stage++;
      document.getElementById('score-badge').innerText = `SAVED: ${savedCount}`;
      document.getElementById('screen-title').innerText = "STAGE CLEAR!";
      document.getElementById('screen-title').className = "screen-title title-win";
      document.getElementById('screen-desc').innerText = msg;
      document.getElementById('overlay-screen').classList.remove('hidden');
    }

    function failStage(msg) {
      gameState = 'FAIL';
      document.getElementById('screen-title').innerText = "ASSASSINATED!";
      document.getElementById('screen-title').className = "screen-title title-fail";
      document.getElementById('screen-desc').innerText = msg;
      document.getElementById('overlay-screen').classList.remove('hidden');
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.onload = init3D;
  </script>
</body>
</html>
