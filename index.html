<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mr. President 3D Pro Physics</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .ui-layer {
      position: absolute;
      top: 12px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: 800;
      color: #f8fafc;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      z-index: 5;
    }
    #timer-display {
      color: #ef4444;
      font-size: 22px;
    }
    .game-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 10;
      text-align: center;
      padding: 20px;
      backdrop-filter: blur(5px);
    }
    .game-screen h1 {
      font-size: 28px;
      margin-bottom: 10px;
      font-weight: 900;
    }
    .game-screen h1.win { color: #22c55e; }
    .game-screen h1.fail { color: #ef4444; }
    .game-screen p {
      font-size: 15px;
      margin-bottom: 20px;
      color: #cbd5e1;
      max-width: 400px;
      line-height: 1.4;
    }
    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 14px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
    }
    .btn:active {
      transform: scale(0.95);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="ui-layer">
      <div id="level-text">Уровень: 1</div>
      <div id="timer-display">3.0s</div>
      <div id="score-text">Побед: 0</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="overlay-screen" class="game-screen hidden">
      <h1 id="screen-title">GET DOWN MR. PRESIDENT!</h1>
      <p id="screen-desc">Толкайте Президента в безопасную синюю зону или закрывайте его собой!</p>
      <button class="btn" id="main-btn" onclick="nextAction()">НАЧАТЬ</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    }

    document.body.addEventListener('touchmove', function(e) {
      e.preventDefault();
    }, { passive: false });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const levelEl = document.getElementById('level-text');
    const scoreEl = document.getElementById('score-text');
    const timerEl = document.getElementById('timer-display');
    const overlayEl = document.getElementById('overlay-screen');
    const titleEl = document.getElementById('screen-title');
    const descEl = document.getElementById('screen-desc');
    const mainBtn = document.getElementById('main-btn');

    let width, height;
    let level = 1;
    let wins = 0;
    let gameState = 'START';
    let timeScale = 1.0;
    let animTime = 0;

    let president = { x: 0, y: 0, r: 24, vx: 0, vy: 0, angle: 0, vRot: 0, saved: false, hit: false, walkDir: 1, animPhase: 0 };
    let guard = { x: 0, y: 0, r: 26, vx: 0, vy: 0, angle: 0, vRot: 0, flying: false, shoutTimer: 0, animPhase: 0 };
    let safeZone = { x: 0, y: 0, w: 0, h: 0 };

    let snipers = [];
    let bullets = [];
    let particles = [];
    let walls = [];

    let countdown = 3.0;
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let dragCurrent = { x: 0, y: 0 };

    function playGunshotSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = audioCtx.sampleRate * 0.3;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.25);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
      } catch (e) {}
    }

    function createHitParticles(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = Math.random() * 6 + 2;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 1.0,
          color
        });
      }
    }

    function createConfetti() {
      const colors = ['#f43f5e', '#3b82f6', '#22c55e', '#eab308', '#a855f7'];
      for (let i = 0; i < 60; i++) {
        particles.push({
          x: Math.random() * width,
          y: -10,
          vx: (Math.random() - 0.5) * 6,
          vy: Math.random() * 5 + 3,
          life: 2.0,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    }

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }

    window.addEventListener('resize', resize);
    resize();

    function initLevel() {
      safeZone = {
        x: width * 0.1,
        y: height * 0.1,
        w: width * 0.8,
        h: height * 0.18
      };

      president = { 
        x: width * 0.5, 
        y: height * 0.45, 
        r: 24, vx: 0, vy: 0, angle: 0, vRot: 0, 
        saved: false, hit: false, walkDir: Math.random() > 0.5 ? 1 : -1,
        animPhase: 0
      };

      const spawnSides = [
        { x: width * 0.2, y: height * 0.82 },
        { x: width * 0.8, y: height * 0.82 },
        { x: width * 0.5, y: height * 0.85 }
      ];
      const randomSpawn = spawnSides[Math.floor(Math.random() * spawnSides.length)];

      guard = { 
        x: randomSpawn.x, 
        y: randomSpawn.y, 
        r: 26, vx: 0, vy: 0, angle: 0, vRot: 0, flying: false, shoutTimer: 0,
        animPhase: 0
      };

      walls = [];
      const wallCount = Math.min(Math.floor((level - 1) / 2), 4);
      for (let i = 0; i < wallCount; i++) {
        walls.push({
          x: width * (0.2 + (i % 2) * 0.6),
          y: height * (0.35 + Math.floor(i / 2) * 0.25),
          w: Math.min(width * 0.25, 110),
          h: 22
        });
      }

      snipers = [];
      const sniperCount = Math.min(1 + Math.floor((level - 1) / 2), 4);
      for (let i = 0; i < sniperCount; i++) {
        snipers.push({
          x: (width / (sniperCount + 1)) * (i + 1) + (Math.random() * 20 - 10),
          y: 35 + Math.random() * 15,
          targetX: president.x,
          targetY: president.y,
          swayOffset: Math.random() * Math.PI * 2
        });
      }

      bullets = [];
      particles = [];
      timeScale = 1.0;
      countdown = Math.max(2.2, (4.0 - level * 0.15).toFixed(1));
      gameState = 'AIMING';
      overlayEl.classList.add('hidden');
    }

    function onTouchStart(e) {
      if (gameState !== 'AIMING') return;
      const p = getPos(e);
      isDragging = true;
      dragStart = p;
      dragCurrent = p;
    }

    function onTouchMove(e) {
      if (!isDragging) return;
      dragCurrent = getPos(e);
    }

    function onTouchEnd() {
      if (!isDragging) return;
      isDragging = false;

      const dx = dragStart.x - dragCurrent.x;
      const dy = dragStart.y - dragCurrent.y;
      const force = Math.min(Math.hypot(dx, dy) * 0.22, 30);
      
      if (force > 2) {
        const angle = Math.atan2(dy, dx);
        guard.vx = Math.cos(angle) * force;
        guard.vy = Math.sin(angle) * force;
        guard.vRot = (Math.random() - 0.5) * 0.5;
        guard.flying = true;
        guard.shoutTimer = 1.2;

        if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
      }
    }

    function getPos(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX, y: clientY };
    }

    canvas.addEventListener('mousedown', onTouchStart);
    canvas.addEventListener('mousemove', onTouchMove);
    window.addEventListener('mouseup', onTouchEnd);

    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', onTouchMove, { passive: false });
    window.addEventListener('touchend', onTouchEnd);

    function shootSnipers() {
      gameState = 'SHOT';
      playGunshotSound();

      snipers.forEach(s => {
        const angle = Math.atan2(s.targetY - s.y, s.targetX - s.x);
        const speed = 22;
        bullets.push({
          x: s.x,
          y: s.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: 6,
          bounces: 0,
          active: true
        });
      });

      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
    }

    function isPointInSafeZone(x, y) {
      return x >= safeZone.x && x <= safeZone.x + safeZone.w &&
             y >= safeZone.y && y <= safeZone.y + safeZone.h;
    }

    // Обработка столкновения круга с прямоугольником (Стена)
    function resolveCircleWallCollision(circle, wall) {
      const closeX = Math.max(wall.x - wall.w/2, Math.min(circle.x, wall.x + wall.w/2));
      const closeY = Math.max(wall.y - wall.h/2, Math.min(circle.y, wall.y + wall.h/2));
      const distX = circle.x - closeX;
      const distY = circle.y - closeY;
      const distance = Math.hypot(distX, distY);

      if (distance < circle.r) {
        const overlap = circle.r - distance;
        const nx = distance === 0 ? 0 : distX / distance;
        const ny = distance === 0 ? -1 : distY / distance;

        circle.x += nx * overlap;
        circle.y += ny * overlap;

        const dot = circle.vx * nx + circle.vy * ny;
        circle.vx = (circle.vx - 2 * dot * nx) * 0.6;
        circle.vy = (circle.vy - 2 * dot * ny) * 0.6;
      }
    }

    function update() {
      animTime += 0.05;

      if (gameState === 'AIMING' && countdown < 0.6) {
        timeScale = 0.35;
      } else if (gameState === 'SHOT') {
        timeScale = 0.45;
      } else {
        timeScale = 1.0;
      }

      const dt = (1 / 60) * timeScale;

      if (guard.shoutTimer > 0) guard.shoutTimer -= dt;

      if (gameState === 'AIMING') {
        countdown -= dt;
        
        if (!president.saved) {
          president.x += president.walkDir * 0.8;
          president.animPhase += 0.15;
          if (president.x < width * 0.25 || president.x > width * 0.75) {
            president.walkDir *= -1;
          }
        }

        // Всплывающее прицеливание снайперов
        snipers.forEach(s => {
          s.targetX = president.x + Math.sin(animTime * 2 + s.swayOffset) * 15;
          s.targetY = president.y + Math.cos(animTime * 2 + s.swayOffset) * 15;
        });

        if (president.saved && isPointInSafeZone(president.x, president.y)) {
          winLevel("ПРЕЗИДЕНТ УСПЕШНО ЭВАКУИРОВАН В БЕЗОПАСНУЮ ЗОНУ!");
          return;
        }

        if (countdown <= 0) {
          countdown = 0;
          timerEl.innerText = "0.0s";
          shootSnipers();
        } else {
          timerEl.innerText = countdown.toFixed(1) + "s";
        }
      }

      // Физика телохранителя
      if (guard.flying || Math.hypot(guard.vx, guard.vy) > 0.1) {
        guard.x += guard.vx * timeScale;
        guard.y += guard.vy * timeScale;
        guard.angle += guard.vRot * timeScale;
        guard.vx *= 0.985;
        guard.vy *= 0.985;
        guard.vRot *= 0.97;

        // Отскок от стен экрана
        if (guard.x - guard.r < 0) { guard.x = guard.r; guard.vx *= -0.7; }
        else if (guard.x + guard.r > width) { guard.x = width - guard.r; guard.vx *= -0.7; }
        if (guard.y - guard.r < 0) { guard.y = guard.r; guard.vy *= -0.7; }
        else if (guard.y + guard.r > height) { guard.y = height - guard.r; guard.vy *= -0.7; }

        walls.forEach(w => resolveCircleWallCollision(guard, w));

        // Столкновение с Президентом
        const distPres = Math.hypot(guard.x - president.x, guard.y - president.y);
        if (distPres < guard.r + president.r) {
          if (!president.saved) {
            createHitParticles((guard.x + president.x)/2, (guard.y + president.y)/2, '#facc15', 15);
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('rigid');
          }
          president.saved = true;
          const hitAngle = Math.atan2(president.y - guard.y, president.x - guard.x);
          const force = Math.max(Math.hypot(guard.vx, guard.vy), 14);
          
          president.vx = Math.cos(hitAngle) * force * 1.1;
          president.vy = Math.sin(hitAngle) * force * 1.1;
          president.vRot = (Math.random() - 0.5) * 0.8;

          guard.vx *= 0.3;
          guard.vy *= 0.3;
        }
      }

      // Физика Президента
      if (president.saved) {
        president.x += president.vx * timeScale;
        president.y += president.vy * timeScale;
        president.angle += president.vRot * timeScale;
        president.vx *= 0.95;
        president.vy *= 0.95;
        president.vRot *= 0.95;

        if (president.x - president.r < 0) { president.x = president.r; president.vx *= -0.6; }
        else if (president.x + president.r > width) { president.x = width - president.r; president.vx *= -0.6; }
        if (president.y - president.r < 0) { president.y = president.r; president.vy *= -0.6; }
        else if (president.y + president.r > height) { president.y = height - president.r; president.vy *= -0.6; }

        walls.forEach(w => resolveCircleWallCollision(president, w));
      }

      // Пули и рикошеты
      if (gameState === 'SHOT') {
        let activeBullets = 0;

        bullets.forEach(b => {
          if (!b.active) return;
          b.x += b.vx * timeScale;
          b.y += b.vy * timeScale;
          activeBullets++;

          walls.forEach(w => {
            if (Math.abs(b.x - w.x) < w.w / 2 + b.r &&
                Math.abs(b.y - w.y) < w.h / 2 + b.r) {
              if (b.bounces < 2) {
                b.vy *= -1;
                b.bounces++;
                createHitParticles(b.x, b.y, '#f97316', 6);
              } else {
                b.active = false;
              }
            }
          });

          if (b.x < 0 || b.x > width) {
            b.vx *= -1;
            b.bounces++;
          }

          const distGuard = Math.hypot(b.x - guard.x, b.y - guard.y);
          if (distGuard < b.r + guard.r) {
            b.active = false;
            createHitParticles(b.x, b.y, '#ef4444', 16);
            winLevel("ВЫ ПРИНЯЛИ ПУЛЮ НА СЕБЯ!");
            return;
          }

          const distPres = Math.hypot(b.x - president.x, b.y - president.y);
          if (distPres < b.r + president.r) {
            b.active = false;
            president.hit = true;
            createHitParticles(b.x, b.y, '#dc2626', 20);
            failLevel(b.bounces > 0 ? "СНАЙПЕР ПОПАЛ РИКОШЕТОМ ОТ СТЕНЫ!" : "ПРЕЗИДЕНТ УБИТ!");
            return;
          }

          if (b.y > height || b.y < 0) b.active = false;
        });

        if (activeBullets === 0 && gameState === 'SHOT') {
          if (president.saved) winLevel("ПРЕЗИДЕНТ УСПЕШНО СПАСЕН!");
          else failLevel("СНАЙПЕР ПОПАЛ В ЦЕЛЬ!");
        }
      }

      particles.forEach((p, idx) => {
        p.x += p.vx * timeScale;
        p.y += p.vy * timeScale;
        p.life -= dt * 1.5;
        if (p.life <= 0) particles.splice(idx, 1);
      });
    }

    function winLevel(reason) {
      gameState = 'WIN';
      wins++;
      scoreEl.innerText = `Побед: ${wins}`;
      titleEl.innerText = "УСПЕХ!";
      titleEl.className = "win";
      descEl.innerText = reason;
      mainBtn.innerText = "СЛЕДУЮЩИЙ УРОВЕНЬ";
      overlayEl.classList.remove('hidden');
      createConfetti();
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }

    function failLevel(reason) {
      gameState = 'FAIL';
      titleEl.innerText = "ПРОВАЛ!";
      titleEl.className = "fail";
      descEl.innerText = reason;
      mainBtn.innerText = "ПОПРОБОВАТЬ СНОВА";
      overlayEl.classList.remove('hidden');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    }

    function nextAction() {
      if (gameState === 'WIN') {
        level++;
        levelEl.innerText = `Уровень: ${level}`;
      }
      initLevel();
    }

    // Анимированная 3D-модель человека с процедурными конечностями
    function draw3DHuman(x, y, type, angle = 0, isRagdoll = false, walkPhase = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      // Тень
      ctx.beginPath();
      ctx.ellipse(0, 15, 20, 8, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.fill();

      const legSwing = isRagdoll ? Math.sin(animTime * 12) * 14 : Math.sin(walkPhase) * 10;
      const armSwing = isRagdoll ? Math.cos(animTime * 12) * 16 : -Math.sin(walkPhase) * 12;

      // Ноги
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-12, 10, 8, 12 + legSwing * 0.3);
      ctx.fillRect(4, 10, 8, 12 - legSwing * 0.3);

      if (type === 'president') {
        // Костюм Президента (Зеленый/Синий пиджак)
        ctx.fillStyle = '#15803d';
        ctx.beginPath();
        ctx.roundRect(-16, -5, 32, 22, 6);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-5, -5, 10, 10);

        ctx.fillStyle = '#dc2626';
        ctx.fillRect(-2, -3, 4, 10);

        // Руки
        ctx.fillStyle = '#15803d';
        ctx.fillRect(-20, -3 + armSwing * 0.3, 6, 16);
        ctx.fillRect(14, -3 - armSwing * 0.3, 6, 16);

        // Голова
        let headGrad = ctx.createRadialGradient(-3, -18, 3, 0, -15, 12);
        headGrad.addColorStop(0, '#fde047');
        headGrad.addColorStop(1, '#ca8a04');
        ctx.beginPath();
        ctx.arc(0, -15, 12, 0, Math.PI * 2);
        ctx.fillStyle = headGrad;
        ctx.fill();
      } else {
        // Костюм Телохранителя (Черный смокинг)
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.roundRect(-18, -6, 36, 25, 8);
        ctx.fill();

        ctx.fillStyle = '#0284c7';
        ctx.fillRect(-8, -2, 16, 16);

        // Руки
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-22, -3 + armSwing * 0.4, 6, 18);
        ctx.fillRect(16, -3 - armSwing * 0.4, 6, 18);

        // Голова
        let headGrad = ctx.createRadialGradient(-3, -18, 3, 0, -15, 12);
        headGrad.addColorStop(0, '#94a3b8');
        headGrad.addColorStop(1, '#334155');
        ctx.beginPath();
        ctx.arc(0, -15, 12, 0, Math.PI * 2);
        ctx.fillStyle = headGrad;
        ctx.fill();

        // Очки
        ctx.fillStyle = '#000000';
        ctx.fillRect(-8, -18, 16, 5);
      }

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Безопасная зона эвакуации
      ctx.fillStyle = 'rgba(14, 165, 233, 0.15)';
      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 6]);
      ctx.fillRect(safeZone.x, safeZone.y, safeZone.w, safeZone.h);
      ctx.strokeRect(safeZone.x, safeZone.y, safeZone.w, safeZone.h);
      ctx.setLineDash([]);

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText("ЗОНА ЭВАКУАЦИИ", safeZone.x + 10, safeZone.y + 20);

      // Отрисовка стен
      walls.forEach(w => {
        ctx.fillStyle = '#475569';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 8;
        ctx.fillRect(w.x - w.w / 2, w.y - w.h / 2, w.w, w.h);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#64748b';
        ctx.fillRect(w.x - w.w / 2 + 3, w.y - w.h / 2 + 3, w.w - 6, w.h - 6);
      });

      // Снайперы и лазеры
      snipers.forEach(s => {
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(s.x, s.y, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(s.x - 2, s.y, 4, 10);

        if (gameState === 'AIMING') {
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(s.targetX, s.targetY);
          ctx.strokeStyle = 'rgba(239, 68, 68, 0.6)';
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 6]);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      });

      // Вектор броска
      if (isDragging) {
        const dx = dragStart.x - dragCurrent.x;
        const dy = dragStart.y - dragCurrent.y;
        ctx.beginPath();
        ctx.moveTo(guard.x, guard.y);
        ctx.lineTo(guard.x + dx, guard.y + dy);
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      // Анимированные персонажи
      draw3DHuman(president.x, president.y, 'president', president.angle, president.saved, president.animPhase);
      draw3DHuman(guard.x, guard.y, 'guard', guard.angle, guard.flying, 0);

      // Комиксный балун "GET DOWN!"
      if (guard.shoutTimer > 0) {
        ctx.save();
        ctx.translate(guard.x, guard.y - 45);
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(-50, -20, 100, 30, 8);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#dc2626';
        ctx.font = '900 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("GET DOWN!", 0, 0);
        ctx.restore();
      }

      // Пули
      bullets.forEach(b => {
        if (!b.active) return;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = '#facc15';
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x - b.vx * 2, b.y - b.vy * 2);
        ctx.strokeStyle = '#f97316';
        ctx.lineWidth = 5;
        ctx.stroke();
      });

      // Частицы и конфетти
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fill();
        ctx.globalAlpha = 1.0;
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    titleEl.innerText = "GET DOWN MR. PRESIDENT!";
    descEl.innerText = "Толкайте Президента в безопасную синюю зону или закрывайте его собой!";
    mainBtn.innerText = "ИГРАТЬ";
    overlayEl.classList.remove('hidden');

    loop();
  </script>
</body>
</html>
