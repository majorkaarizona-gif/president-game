<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mr. President! 3D Mobile Edition</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- 3D Engine & Physics libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: 'Montserrat', sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Подсказка для поворота экрана */
    #rotate-device-hint {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #090d16;
      z-index: 999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    #rotate-device-hint img {
      width: 80px;
      margin-bottom: 20px;
      animation: rotateAnim 2s infinite ease-in-out;
    }
    @keyframes rotateAnim {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
    }

    @media screen and (orientation: portrait) {
      #rotate-device-hint { display: flex; }
    }

    /* ИНТЕРФЕЙС ИЗ ИГРЫ MR. PRESIDENT! */
    .ui-top {
      position: absolute;
      top: 12px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    .badge {
      background: #dc2626;
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      font-style: italic;
      padding: 6px 14px;
      transform: skew(-12deg);
      box-shadow: 3px 3px 0px #000;
      border: 2px solid #fff;
      text-transform: uppercase;
    }
    .badge-blue { background: #2563eb; }
    .badge-yellow { background: #f59e0b; color: #000; }

    #crosshair-hint {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      font-size: 14px;
      font-weight: 900;
      font-style: italic;
      color: #f59e0b;
      text-shadow: 0 2px 4px #000;
      pointer-events: none;
      z-index: 10;
      letter-spacing: 1px;
    }

    /* ЭКРАНЫ РЕЗУЛЬТАТОВ */
    .game-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 8, 15, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      backdrop-filter: blur(4px);
    }
    .screen-title {
      font-size: 28px;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      padding: 8px 24px;
      transform: skew(-10deg);
      box-shadow: 5px 5px 0px #000;
      margin-bottom: 12px;
      border: 3px solid #fff;
    }
    .title-win { background: #16a34a; color: #fff; }
    .title-fail { background: #dc2626; color: #fff; }
    .title-start { background: #2563eb; color: #fff; }

    .screen-desc {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #cbd5e1;
      max-width: 420px;
      text-align: center;
      line-height: 1.3;
    }
    .btn-action {
      background: #f59e0b;
      color: #000;
      border: 3px solid #fff;
      padding: 12px 36px;
      font-size: 18px;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      transform: skew(-10deg);
      box-shadow: 4px 4px 0px #000;
      cursor: pointer;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="rotate-device-hint">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><path d="M12 8v8"></path></svg>
    <p style="font-weight: 900; font-size: 18px; color: #fff; margin-top: 15px;">ПЕРЕВЕРНИТЕ ТЕЛЕФОН</p>
    <p style="font-size: 12px; color: #94a3b8; margin-top: 5px;">Для комфортной игры в Mr. President включите альбомный режим</p>
  </div>

  <div id="canvas-container"></div>

  <div class="ui-top">
    <div class="badge badge-blue" id="level-text">STAGE 1</div>
    <div class="badge badge-yellow" id="timer-display">3.0s</div>
    <div class="badge" id="score-text">SAVED: 0</div>
  </div>

  <div id="crosshair-hint">SWIPE & FLING DICK JOHNSON TO SAVE RUMP!</div>

  <div id="overlay-screen" class="game-screen hidden">
    <div class="screen-title title-start" id="screen-title">MR. PRESIDENT!</div>
    <p class="screen-desc" id="screen-desc">Прыгайте телохранителем, сбивайте баррикады и закройте собой Президента Рональда Рампа от пули снайпера!</p>
    <button class="btn-action" id="main-btn" onclick="nextStage()">START GAME</button>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.requestLandscape) tg.requestLandscape();
    }

    // --- 3D И СИМУЛЯЦИЯ ФИЗИКИ (THREE.JS + CANNON.JS) ---
    let scene, camera, renderer, world;
    let level = 1, wins = 0;
    let gameState = 'START';
    let countdown = 3.0;
    let timeScale = 1.0;

    let rumpMesh, rumpBody;
    let guardMesh, guardBody;
    let bulletMesh, bulletBody;
    let sniperLine, trajectoryLine;
    let destructibles = [];

    let touchStart = { x: 0, y: 0 };
    let touchCurrent = { x: 0, y: 0 };
    let isTouching = false;

    function init3D() {
      const container = document.getElementById('canvas-container');
      
      // Сцена Three.js
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0f1d);
      scene.fog = new THREE.FogExp2(0x0a0f1d, 0.015);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 4, 12);
      camera.lookAt(0, 1.5, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // Освещение (Американское шоу / Митинг)
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      scene.add(dirLight);

      // Физика Cannon.js
      world = new CANNON.World();
      world.gravity.set(0, -9.82, 0);

      createEnvironment();
      setupInputListeners();
      initStage();

      animate();
    }

    // Создание карты (Сцена выступления Rump)
    function createEnvironment() {
      // Пол (Красный ковер)
      const floorGeo = new THREE.PlaneGeometry(30, 40);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x881337, roughness: 0.8 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
      floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
      world.addBody(floorBody);

      // Флаг США на заднем плане
      const flagGeo = new THREE.PlaneGeometry(16, 8);
      const flagMat = new THREE.MeshBasicMaterial({ color: 0x1e3a8a });
      const flag = new THREE.Mesh(flagGeo, flagMat);
      flag.position.set(0, 6, -10);
      scene.add(flag);

      // Траектория прицеливания свайпом
      const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
      const lineMat = new THREE.LineBasicMaterial({ color: 0xf59e0b, linewidth: 4 });
      trajectoryLine = new THREE.Line(lineGeo, lineMat);
      trajectoryLine.visible = false;
      scene.add(trajectoryLine);

      // Лазер снайпера
      const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
      const laserMat = new THREE.LineBasicMaterial({ color: 0xef4444, linewidth: 2 });
      sniperLine = new THREE.Line(laserGeo, laserMat);
      scene.add(sniperLine);
    }

    // Создание Рональда Рампа
    function createRump(x, z) {
      const group = new THREE.Group();

      // Тело (Синий костюм)
      const bodyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.2, 12);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1e3a8a });
      const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
      bodyMesh.position.y = 0.6;
      bodyMesh.castShadow = true;
      group.add(bodyMesh);

      // Голова и знаменитая желтая прическа
      const headGeo = new THREE.SphereGeometry(0.3, 12, 12);
      const headMat = new THREE.MeshStandardMaterial({ color: 0xfde047 });
      const headMesh = new THREE.Mesh(headGeo, headMat);
      headMesh.position.y = 1.4;
      headMesh.scale.set(1.2, 0.8, 1.3);
      headMesh.castShadow = true;
      group.add(headMesh);

      scene.add(group);

      const shape = new CANNON.Cylinder(0.4, 0.4, 1.4, 8);
      rumpBody = new CANNON.Body({ mass: 65, shape });
      rumpBody.position.set(x, 0.7, z);
      world.addBody(rumpBody);

      rumpMesh = group;
    }

    // Создание Телохранителя Дика Джонсона
    function createGuard(x, z) {
      const group = new THREE.Group();

      // Черный костюм
      const bodyGeo = new THREE.BoxGeometry(0.9, 1.4, 0.5);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x090d16 });
      const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
      bodyMesh.position.y = 0.7;
      bodyMesh.castShadow = true;
      group.add(bodyMesh);

      // Голова
      const headGeo = new THREE.SphereGeometry(0.28, 12, 12);
      const headMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8 });
      const headMesh = new THREE.Mesh(headGeo, headMat);
      headMesh.position.y = 1.5;
      group.add(headMesh);

      scene.add(group);

      const shape = new CANNON.Box(new CANNON.Vec3(0.45, 0.7, 0.25));
      guardBody = new CANNON.Body({ mass: 90, shape });
      guardBody.position.set(x, 0.7, z);
      world.addBody(guardBody);

      guardMesh = group;
    }

    // Создание Трибуны и Разрушаемых объектов
    function createDestructibles() {
      destructibles.forEach(obj => {
        scene.remove(obj.mesh);
        world.remove(obj.body);
      });
      destructibles = [];

      // Трибуна Президентская
      const boxGeo = new THREE.BoxGeometry(1.6, 1.1, 0.8);
      const boxMat = new THREE.MeshStandardMaterial({ color: 0x78350f });
      const podiumMesh = new THREE.Mesh(boxGeo, boxMat);
      podiumMesh.castShadow = true;
      scene.add(podiumMesh);

      const podiumShape = new CANNON.Box(new CANNON.Vec3(0.8, 0.55, 0.4));
      const podiumBody = new CANNON.Body({ mass: 15, shape: podiumShape });
      podiumBody.position.set(0, 0.55, -2);
      world.addBody(podiumBody);

      destructibles.push({ mesh: podiumMesh, body: podiumBody });
    }

    function initStage() {
      if (rumpMesh) { scene.remove(rumpMesh); world.remove(rumpBody); }
      if (guardMesh) { scene.remove(guardMesh); world.remove(guardBody); }
      if (bulletMesh) { scene.remove(bulletMesh); world.remove(bulletBody); }

      createRump(0, -2);
      createGuard(0, 4);
      createDestructibles();

      countdown = Math.max(1.8, (3.2 - level * 0.15)).toFixed(1);
      gameState = 'AIMING';
      timeScale = 1.0;

      document.getElementById('level-text').innerText = `STAGE ${level}`;
      document.getElementById('overlay-screen').classList.add('hidden');
    }

    // Управление касаниями / Свайпами
    function setupInputListeners() {
      const dom = renderer.domElement;

      const handleStart = (e) => {
        if (gameState !== 'AIMING') return;
        const p = e.touches ? e.touches[0] : e;
        touchStart = { x: p.clientX, y: p.clientY };
        touchCurrent = touchStart;
        isTouching = true;
      };

      const handleMove = (e) => {
        if (!isTouching) return;
        const p = e.touches ? e.touches[0] : e;
        touchCurrent = { x: p.clientX, y: p.clientY };

        // Отрисовка вектора броска
        const dx = (touchStart.x - touchCurrent.x) * 0.02;
        const dz = (touchStart.y - touchCurrent.y) * 0.02;

        const p1 = guardMesh.position.clone();
        const p2 = p1.clone().add(new THREE.Vector3(-dx, Math.abs(dz) * 0.5, -dz));

        trajectoryLine.geometry.setFromPoints([p1, p2]);
        trajectoryLine.visible = true;
      };

      const handleEnd = () => {
        if (!isTouching) return;
        isTouching = false;
        trajectoryLine.visible = false;

        const dx = (touchStart.x - touchCurrent.x) * 0.15;
        const dz = (touchStart.y - touchCurrent.y) * 0.15;
        const force = Math.hypot(dx, dz);

        if (force > 1.2) {
          // Прыжок телохранителя с полной физикой
          guardBody.velocity.set(-dx * 1.8, Math.min(force * 0.8, 12), -dz * 1.8);
          guardBody.angularVelocity.set(Math.random() * 5, Math.random() * 5, Math.random() * 5);

          if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
        }
      };

      dom.addEventListener('mousedown', handleStart);
      dom.addEventListener('mousemove', handleMove);
      window.addEventListener('mouseup', handleEnd);

      dom.addEventListener('touchstart', handleStart);
      dom.addEventListener('touchmove', handleMove);
      window.addEventListener('touchend', handleEnd);
    }

    // Выстрел снайпера
    function shootBullet() {
      gameState = 'SHOT';

      const bulletGeo = new THREE.SphereGeometry(0.15, 8, 8);
      const bulletMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
      bulletMesh = new THREE.Mesh(bulletGeo, bulletMat);
      scene.add(bulletMesh);

      const startPos = new THREE.Vector3(8, 6, -12);
      const targetPos = rumpMesh.position.clone();
      const dir = targetPos.clone().sub(startPos).normalize();

      bulletBody = new CANNON.Body({ mass: 0.1, shape: new CANNON.Sphere(0.15) });
      bulletBody.position.set(startPos.x, startPos.y, startPos.z);
      bulletBody.velocity.set(dir.x * 35, dir.y * 35, dir.z * 35);
      world.addBody(bulletBody);
    }

    function updatePhysics() {
      const dt = (1 / 60) * timeScale;
      world.step(dt);

      // Синхронизация 3D графики с Cannon.js физикой
      rumpMesh.position.copy(rumpBody.position);
      rumpMesh.quaternion.copy(rumpBody.quaternion);

      guardMesh.position.copy(guardBody.position);
      guardMesh.quaternion.copy(guardBody.quaternion);

      destructibles.forEach(d => {
        d.mesh.position.copy(d.body.position);
        d.mesh.quaternion.copy(d.body.quaternion);
      });

      if (bulletMesh && bulletBody) {
        bulletMesh.position.copy(bulletBody.position);

        // Коллизия пули с Телохранителем
        if (bulletMesh.position.distanceTo(guardMesh.position) < 0.9) {
          winStage("YOU TOOK THE BULLET FOR RUMP!");
          return;
        }

        // Коллизия пули с Президентом
        if (bulletMesh.position.distanceTo(rumpMesh.position) < 0.7) {
          failStage("PRESIDENT RUMP WAS ASSASSINATED!");
          return;
        }
      }

      // Обновление лазера снайпера
      if (gameState === 'AIMING') {
        const sniperPos = new THREE.Vector3(8, 6, -12);
        sniperLine.geometry.setFromPoints([sniperPos, rumpMesh.position]);
      } else {
        sniperLine.visible = false;
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      if (gameState === 'AIMING') {
        countdown -= 1 / 60;
        document.getElementById('timer-display').innerText = Math.max(0, countdown).toFixed(1) + "s";

        if (countdown <= 0.8) timeScale = 0.3; // Slow-Motion перед выстрелом

        if (countdown <= 0) {
          shootBullet();
        }
      }

      updatePhysics();
      renderer.render(scene, camera);
    }

    function winStage(msg) {
      gameState = 'WIN';
      wins++;
      document.getElementById('score-text').innerText = `SAVED: ${wins}`;
      document.getElementById('screen-title').innerText = "STAGE CLEAR!";
      document.getElementById('screen-title').className = "screen-title title-win";
      document.getElementById('screen-desc').innerText = msg;
      document.getElementById('main-btn').innerText = "NEXT LEVEL";
      document.getElementById('overlay-screen').classList.remove('hidden');
    }

    function failStage(msg) {
      gameState = 'FAIL';
      document.getElementById('screen-title').innerText = "ASSASSINATED!";
      document.getElementById('screen-title').className = "screen-title title-fail";
      document.getElementById('screen-desc').innerText = msg;
      document.getElementById('main-btn').innerText = "RETRY";
      document.getElementById('overlay-screen').classList.remove('hidden');
    }

    function nextStage() {
      if (gameState === 'WIN') level++;
      initStage();
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.onload = init3D;
  </script>
</body>
</html>
