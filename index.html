<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mr. President! Full Mobile Game</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: 'Montserrat', sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050811;
      color: #ffffff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0f172a;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ИНТЕРФЕЙС B ИГРОВОМ СТИЛЕ MR. PRESIDENT */
    .ui-header {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      pointer-events: none;
    }
    .badge {
      background: #dc2626;
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      font-style: italic;
      padding: 6px 14px;
      transform: skew(-12deg);
      box-shadow: 3px 3px 0px #000;
      border: 2px solid #fff;
      text-transform: uppercase;
    }
    .badge-blue { background: #2563eb; }
    .badge-yellow { background: #f59e0b; color: #000; }

    /* ЭКРАН МЕНЮ И УРОВНЕЙ */
    .game-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 8, 17, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      text-align: center;
      padding: 20px;
      backdrop-filter: blur(8px);
    }
    .screen-title {
      font-size: 28px;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      padding: 10px 20px;
      transform: skew(-10deg);
      box-shadow: 5px 5px 0px #000;
      margin-bottom: 12px;
      border: 3px solid #fff;
    }
    .title-win { background: #16a34a; }
    .title-fail { background: #dc2626; }
    .title-start { background: #2563eb; }

    .btn-action {
      background: #f59e0b;
      color: #000;
      border: 3px solid #fff;
      padding: 14px 32px;
      font-size: 18px;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      transform: skew(-10deg);
      box-shadow: 4px 4px 0px #000;
      cursor: pointer;
      margin-top: 10px;
      pointer-events: auto;
    }
    .btn-action:active {
      transform: skew(-10deg) translate(2px, 2px);
      box-shadow: 2px 2px 0px #000;
    }

    #controls-layer {
      position: absolute;
      bottom: 15px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 6;
      padding: 0 15px;
      pointer-events: none;
    }
    .control-btn {
      pointer-events: auto;
      background: rgba(37, 99, 235, 0.85);
      border: 2px solid #fff;
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      font-style: italic;
      padding: 12px 20px;
      transform: skew(-10deg);
      box-shadow: 3px 3px 0px #000;
    }
    .control-btn:active {
      background: #f59e0b;
      color: #000;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="ui-header">
      <div class="badge badge-blue" id="level-text">LEVEL 1</div>
      <div class="badge badge-yellow" id="timer-display">3.0s</div>
      <div class="badge" id="score-text">WINS: 0</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="controls-layer">
      <button class="control-btn" onclick="triggerSlowMo()">SLOW-MO</button>
      <button class="control-btn" onclick="toggleOrientation()">ROTATE SCREEN</button>
    </div>

    <div id="overlay-screen" class="game-screen hidden">
      <div class="screen-title title-start" id="screen-title">MR. PRESIDENT!</div>
      <p style="margin-bottom: 20px; max-width: 350px; font-size: 14px; line-height: 1.4;" id="screen-desc">
        Защитите Президента Rump! Прыгайте под пули, используйте батуты и разгребайте завалы!
      </p>
      <button class="btn-action" id="main-btn" onclick="nextAction()">START GAME</button>
    </div>
  </div>

  <script>
    // Инициализация Telegram Mini App
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    }

    document.body.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const levelEl = document.getElementById('level-text');
    const scoreEl = document.getElementById('score-text');
    const timerEl = document.getElementById('timer-display');
    const overlayEl = document.getElementById('overlay-screen');
    const titleEl = document.getElementById('screen-title');
    const descEl = document.getElementById('screen-desc');
    const mainBtn = document.getElementById('main-btn');

    let width, height;
    let level = 1;
    let wins = 0;
    let gameState = 'START';
    let timeScale = 1.0;
    let slowMoTimer = 0;

    // Ragdoll персонажи
    let president = { x: 0, y: 0, r: 22, vx: 0, vy: 0, angle: 0, vRot: 0, saved: false, hit: false, walkDir: 1 };
    let guard = { x: 0, y: 0, r: 24, vx: 0, vy: 0, angle: 0, vRot: 0, flying: false, shoutTimer: 0 };
    
    let safeZone = { x: 0, y: 0, w: 0, h: 0 };
    let snipers = [], bullets = [], particles = [], obstacles = [], jumpPads = [];
    let countdown = 3.0;

    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let dragCurrent = { x: 0, y: 0 };

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Запрос переворота экрана
    function toggleOrientation() {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        document.documentElement.requestFullscreen().then(() => {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
          }
        }).catch(() => {});
      }
    }

    function triggerSlowMo() {
      slowMoTimer = 2.0;
    }

    function initLevel() {
      safeZone = { x: width * 0.2, y: height * 0.08, w: width * 0.6, h: height * 0.15 };

      president = { 
        x: width * 0.5, y: height * 0.42, r: 22, vx: 0, vy: 0, angle: 0, vRot: 0, 
        saved: false, hit: false, walkDir: 1 
      };

      guard = { 
        x: width * 0.5, y: height * 0.82, r: 24, vx: 0, vy: 0, angle: 0, vRot: 0, 
        flying: false, shoutTimer: 0 
      };

      // Генерируем препятствия (коробки, батуты) из видео
      obstacles = [];
      jumpPads = [];
      
      if (level % 2 === 0) {
        jumpPads.push({ x: width * 0.5, y: height * 0.68, w: 80, h: 18 });
      }

      const obsCount = Math.min(Math.floor(level / 2), 4);
      for (let i = 0; i < obsCount; i++) {
        obstacles.push({
          x: width * (0.2 + (i % 3) * 0.3),
          y: height * (0.32 + Math.floor(i / 3) * 0.2),
          w: 90, h: 20, destructible: i % 2 === 0
        });
      }

      snipers = [];
      const sniperCount = Math.min(1 + Math.floor(level / 2), 3);
      for (let i = 0; i < sniperCount; i++) {
        snipers.push({
          x: (width / (sniperCount + 1)) * (i + 1),
          y: 40,
          targetX: president.x, targetY: president.y
        });
      }

      bullets = [];
      particles = [];
      countdown = Math.max(1.8, 3.5 - level * 0.1);
      gameState = 'AIMING';
      overlayEl.classList.add('hidden');
    }

    // Управление касанием (Свайп прыжка)
    function onTouchStart(e) {
      if (gameState !== 'AIMING') return;
      const p = getPos(e);
      isDragging = true;
      dragStart = p;
      dragCurrent = p;
    }

    function onTouchMove(e) {
      if (!isDragging) return;
      dragCurrent = getPos(e);
    }

    function onTouchEnd() {
      if (!isDragging) return;
      isDragging = false;

      const dx = dragStart.x - dragCurrent.x;
      const dy = dragStart.y - dragCurrent.y;
      const force = Math.min(Math.hypot(dx, dy) * 0.22, 35);

      if (force > 3) {
        const angle = Math.atan2(dy, dx);
        guard.vx = Math.cos(angle) * force;
        guard.vy = Math.sin(angle) * force;
        guard.vRot = (Math.random() - 0.5) * 0.8;
        guard.flying = true;
        guard.shoutTimer = 1.0;
        slowMoTimer = 1.2; // Slow-mo эффект прыжка

        if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
      }
    }

    function getPos(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX, y: clientY };
    }

    canvas.addEventListener('mousedown', onTouchStart);
    canvas.addEventListener('mousemove', onTouchMove);
    window.addEventListener('mouseup', onTouchEnd);

    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', onTouchMove, { passive: false });
    window.addEventListener('touchend', onTouchEnd);

    function shootSnipers() {
      gameState = 'SHOT';
      snipers.forEach(s => {
        const angle = Math.atan2(s.targetY - s.y, s.targetX - s.x);
        bullets.push({
          x: s.x, y: s.y,
          vx: Math.cos(angle) * 22, vy: Math.sin(angle) * 22,
          r: 5, active: true
        });
      });
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
    }

    function update() {
      timeScale = slowMoTimer > 0 ? 0.3 : 1.0;
      if (slowMoTimer > 0) slowMoTimer -= 0.016;

      const dt = 0.016 * timeScale;

      if (gameState === 'AIMING') {
        countdown -= dt;

        // Патрулирование Президента
        if (!president.saved) {
          president.x += president.walkDir * 0.7;
          if (president.x < width * 0.25 || president.x > width * 0.75) president.walkDir *= -1;
        }

        snipers.forEach(s => {
          s.targetX = president.x;
          s.targetY = president.y;
        });

        if (countdown <= 0) {
          countdown = 0;
          timerEl.innerText = "0.0s";
          shootSnipers();
        } else {
          timerEl.innerText = countdown.toFixed(1) + "s";
        }
      }

      // Физика Телохранителя
      if (guard.flying || Math.hypot(guard.vx, guard.vy) > 0.1) {
        guard.x += guard.vx * timeScale;
        guard.y += guard.vy * timeScale;
        guard.angle += guard.vRot * timeScale;
        guard.vx *= 0.98;
        guard.vy *= 0.98;

        // Батуты
        jumpPads.forEach(jp => {
          if (Math.abs(guard.x - jp.x) < jp.w/2 && Math.abs(guard.y - jp.y) < jp.h/2) {
            guard.vy = -28;
            guard.vRot = 0.9;
          }
        });

        // Толчок Президента
        const distPres = Math.hypot(guard.x - president.x, guard.y - president.y);
        if (distPres < guard.r + president.r) {
          president.saved = true;
          const hitAngle = Math.atan2(president.y - guard.y, president.x - guard.x);
          const force = Math.max(Math.hypot(guard.vx, guard.vy), 15);
          
          president.vx = Math.cos(hitAngle) * force * 1.2;
          president.vy = Math.sin(hitAngle) * force * 1.2;
          president.vRot = (Math.random() - 0.5) * 1.0;
        }
      }

      // Физика Президента
      if (president.saved) {
        president.x += president.vx * timeScale;
        president.y += president.vy * timeScale;
        president.angle += president.vRot * timeScale;
        president.vx *= 0.96;
        president.vy *= 0.96;

        // Проверка эвакуации
        if (president.x >= safeZone.x && president.x <= safeZone.x + safeZone.w &&
            president.y >= safeZone.y && president.y <= safeZone.y + safeZone.h) {
          winLevel("PRESIDENT IS SAFE!");
        }
      }

      // Пули
      if (gameState === 'SHOT') {
        bullets.forEach(b => {
          if (!b.active) return;
          b.x += b.vx * timeScale;
          b.y += b.vy * timeScale;

          // Спасение своим телом
          if (Math.hypot(b.x - guard.x, b.y - guard.y) < b.r + guard.r) {
            b.active = false;
            winLevel("YOU TOOK THE BULLET FOR RUMP!");
          }

          // Попадание в Президента
          if (Math.hypot(b.x - president.x, b.y - president.y) < b.r + president.r) {
            b.active = false;
            failLevel("PRESIDENT WAS ASSASSINATED!");
          }
        });
      }
    }

    function winLevel(reason) {
      gameState = 'WIN';
      wins++;
      scoreEl.innerText = `WINS: ${wins}`;
      titleEl.innerText = "LEVEL COMPLETED!";
      titleEl.className = "screen-title title-win";
      descEl.innerText = reason;
      mainBtn.innerText = "NEXT LEVEL";
      overlayEl.classList.remove('hidden');
    }

    function failLevel(reason) {
      gameState = 'FAIL';
      titleEl.innerText = "ASSASSINATED!";
      titleEl.className = "screen-title title-fail";
      descEl.innerText = reason;
      mainBtn.innerText = "RETRY";
      overlayEl.classList.remove('hidden');
    }

    function nextAction() {
      if (gameState === 'WIN') {
        level++;
        levelEl.innerText = `LEVEL ${level}`;
      }
      initLevel();
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Фон митинга из видео
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, width, height);

      // Зона спасения
      ctx.fillStyle = 'rgba(37, 99, 235, 0.3)';
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 3;
      ctx.fillRect(safeZone.x, safeZone.y, safeZone.w, safeZone.h);
      ctx.strokeRect(safeZone.x, safeZone.y, safeZone.w, safeZone.h);

      // Батуты
      jumpPads.forEach(jp => {
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(jp.x - jp.w/2, jp.y - jp.h/2, jp.w, jp.h);
      });

      // Баррикады
      obstacles.forEach(o => {
        ctx.fillStyle = o.destructible ? '#78350f' : '#475569';
        ctx.fillRect(o.x - o.w/2, o.y - o.h/2, o.w, o.h);
      });

      // Лазеры снайперов
      snipers.forEach(s => {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(s.x, s.y, 12, 0, Math.PI * 2);
        ctx.fill();

        if (gameState === 'AIMING') {
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(s.targetX, s.targetY);
          ctx.strokeStyle = 'rgba(239, 68, 68, 0.5)';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      });

      // Траектория броска
      if (isDragging) {
        ctx.beginPath();
        ctx.moveTo(guard.x, guard.y);
        ctx.lineTo(guard.x + (dragStart.x - dragCurrent.x), guard.y + (dragStart.y - dragCurrent.y));
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      // Персонажи
      drawRagdoll(president.x, president.y, '#1e3a8a', '#facc15', president.angle);
      drawRagdoll(guard.x, guard.y, '#090d16', '#cbd5e1', guard.angle);

      // Пули
      bullets.forEach(b => {
        if (!b.active) return;
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawRagdoll(x, y, bodyColor, headColor, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      // Тело
      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.roundRect(-15, -10, 30, 24, 6);
      ctx.fill();

      // Голова
      ctx.fillStyle = headColor;
      ctx.beginPath();
      ctx.arc(0, -16, 11, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    overlayEl.classList.remove('hidden');
    loop();
  </script>
</body>
</html>
