<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mr. President 3D Pro Physics</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .ui-layer {
      position: absolute;
      top: 12px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: 800;
      color: #f8fafc;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      z-index: 5;
    }
    #timer-display {
      color: #ef4444;
      font-size: 22px;
    }
    .game-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 10;
      text-align: center;
      padding: 20px;
      backdrop-filter: blur(5px);
    }
    .game-screen h1 {
      font-size: 28px;
      margin-bottom: 10px;
      font-weight: 900;
    }
    .game-screen h1.win { color: #22c55e; }
    .game-screen h1.fail { color: #ef4444; }
    .game-screen p {
      font-size: 15px;
      margin-bottom: 20px;
      color: #cbd5e1;
      max-width: 400px;
      line-height: 1.4;
    }
    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 14px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
    }
    .btn:active {
      transform: scale(0.95);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="ui-layer">
      <div id="level-text">Уровень: 1</div>
      <div id="timer-display">3.0s</div>
      <div id="score-text">Побед: 0</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="overlay-screen" class="game-screen hidden">
      <h1 id="screen-title">GET DOWN MR. PRESIDENT!</h1>
      <p id="screen-desc">Зажмите экран и толкните телохранителя! Использование трибуны защитит Президента от снайперов.</p>
      <button class="btn" id="main-btn" onclick="nextAction()">НАЧАТЬ</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    }

    document.body.addEventListener('touchmove', function(e) {
      e.preventDefault();
    }, { passive: false });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const levelEl = document.getElementById('level-text');
    const scoreEl = document.getElementById('score-text');
    const timerEl = document.getElementById('timer-display');
    const overlayEl = document.getElementById('overlay-screen');
    const titleEl = document.getElementById('screen-title');
    const descEl = document.getElementById('screen-desc');
    const mainBtn = document.getElementById('main-btn');

    let width, height;
    let level = 1;
    let wins = 0;
    let gameState = 'START';
    let timeScale = 1.0; // Для Слоумо

    let president = { x: 0, y: 0, r: 22, vx: 0, vy: 0, angle: 0, vRot: 0, saved: false, hit: false, walkDir: 1 };
    let guard = { x: 0, y: 0, r: 24, vx: 0, vy: 0, angle: 0, vRot: 0, flying: false };
    let podium = { x: 0, y: 0, w: 70, h: 30, destroyed: false };

    let snipers = [];
    let bullets = [];
    let particles = [];
    let debris = [];

    let countdown = 3.0;
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let dragCurrent = { x: 0, y: 0 };

    function playGunshotSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = audioCtx.sampleRate * 0.3;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.25);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
      } catch (e) {}
    }

    function createHitParticles(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = Math.random() * 6 + 2;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 1.0,
          color
        });
      }
    }

    function destroyPodium() {
      if (podium.destroyed) return;
      podium.destroyed = true;
      for (let i = 0; i < 15; i++) {
        debris.push({
          x: podium.x + (Math.random() - 0.5) * podium.w,
          y: podium.y + (Math.random() - 0.5) * podium.h,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.5) * 12,
          size: Math.random() * 10 + 4,
          angle: Math.random() * Math.PI,
          vRot: (Math.random() - 0.5) * 0.3,
          life: 1.0
        });
      }
      createHitParticles(podium.x, podium.y, '#854d0e', 18);
    }

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }

    window.addEventListener('resize', resize);
    resize();

    function initLevel() {
      president = { 
        x: width * 0.5, 
        y: height * 0.35, 
        r: 22, vx: 0, vy: 0, angle: 0, vRot: 0, 
        saved: false, hit: false, walkDir: Math.random() > 0.5 ? 1 : -1 
      };

      podium = {
        x: width * 0.5,
        y: height * 0.45,
        w: 80,
        h: 35,
        destroyed: false
      };

      const spawnSides = [
        { x: width * 0.2, y: height * 0.78 },
        { x: width * 0.8, y: height * 0.78 },
        { x: width * 0.5, y: height * 0.82 }
      ];
      const randomSpawn = spawnSides[Math.floor(Math.random() * spawnSides.length)];

      guard = { 
        x: randomSpawn.x, 
        y: randomSpawn.y, 
        r: 24, vx: 0, vy: 0, angle: 0, vRot: 0, flying: false 
      };

      snipers = [];
      const sniperCount = Math.min(1 + Math.floor((level - 1) / 2), 3);
      for (let i = 0; i < sniperCount; i++) {
        snipers.push({
          x: (width / (sniperCount + 1)) * (i + 1) + (Math.random() * 30 - 15),
          y: 35 + Math.random() * 15,
          targetX: president.x,
          targetY: president.y
        });
      }

      bullets = [];
      particles = [];
      debris = [];
      timeScale = 1.0;
      countdown = Math.max(1.8, (3.5 - Math.random() * 1.2).toFixed(1));
      gameState = 'AIMING';
      overlayEl.classList.add('hidden');
    }

    function onTouchStart(e) {
      if (gameState !== 'AIMING' || guard.flying) return;
      const p = getPos(e);
      isDragging = true;
      dragStart = p;
      dragCurrent = p;
    }

    function onTouchMove(e) {
      if (!isDragging) return;
      dragCurrent = getPos(e);
    }

    function onTouchEnd() {
      if (!isDragging) return;
      isDragging = false;

      const dx = dragStart.x - dragCurrent.x;
      const dy = dragStart.y - dragCurrent.y;
      const force = Math.min(Math.hypot(dx, dy) * 0.18, 26);
      
      if (force > 2) {
        const angle = Math.atan2(dy, dx);
        guard.vx = Math.cos(angle) * force;
        guard.vy = Math.sin(angle) * force;
        guard.vRot = (Math.random() - 0.5) * 0.4;
        guard.flying = true;

        if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
      }
    }

    function getPos(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX, y: clientY };
    }

    canvas.addEventListener('mousedown', onTouchStart);
    canvas.addEventListener('mousemove', onTouchMove);
    window.addEventListener('mouseup', onTouchEnd);

    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', onTouchMove, { passive: false });
    window.addEventListener('touchend', onTouchEnd);

    function shootSnipers() {
      gameState = 'SHOT';
      playGunshotSound();

      snipers.forEach(s => {
        const angle = Math.atan2(s.targetY - s.y, s.targetX - s.x);
        const speed = 22;
        bullets.push({
          x: s.x,
          y: s.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: 6,
          active: true
        });
      });

      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
    }

    function update() {
      // Динамическое замедление времени (Slow-Motion)
      if (gameState === 'AIMING' && countdown < 0.6) {
        timeScale = 0.3; // Слоумо перед самым выстрелом
      } else if (gameState === 'SHOT') {
        timeScale = 0.4; // Слоумо во время полета пуль
      } else {
        timeScale = 1.0;
      }

      const dt = (1 / 60) * timeScale;

      if (gameState === 'AIMING') {
        countdown -= dt;
        
        // Ходьба Президента перед выстрелом
        if (!president.saved) {
          president.x += president.walkDir * 0.8;
          if (president.x < width * 0.3 || president.x > width * 0.7) {
            president.walkDir *= -1;
          }
        }

        if (countdown <= 0) {
          countdown = 0;
          timerEl.innerText = "0.0s";
          shootSnipers();
        } else {
          timerEl.innerText = countdown.toFixed(1) + "s";
        }
      }

      // Физика телохранителя
      if (guard.flying) {
        guard.x += guard.vx * timeScale;
        guard.y += guard.vy * timeScale;
        guard.angle += guard.vRot * timeScale;
        guard.vx *= 0.985;
        guard.vy *= 0.985;
        guard.vRot *= 0.97;

        // Столкновение с трибуной
        if (!podium.destroyed && 
            Math.abs(guard.x - podium.x) < podium.w / 2 + guard.r &&
            Math.abs(guard.y - podium.y) < podium.h / 2 + guard.r) {
          destroyPodium();
          guard.vx *= -0.5;
          guard.vy *= -0.5;
        }

        // Столкновение с президентом
        const distPres = Math.hypot(guard.x - president.x, guard.y - president.y);
        if (distPres < guard.r + president.r) {
          if (!president.saved) {
            createHitParticles((guard.x + president.x)/2, (guard.y + president.y)/2, '#facc15', 15);
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('rigid');
          }
          president.saved = true;
          const hitAngle = Math.atan2(president.y - guard.y, president.x - guard.x);
          const force = Math.hypot(guard.vx, guard.vy);
          
          president.vx = Math.cos(hitAngle) * force * 0.9;
          president.vy = Math.sin(hitAngle) * force * 0.9;
          president.vRot = (Math.random() - 0.5) * 0.6;

          guard.vx *= 0.4;
          guard.vy *= 0.4;
        }
      }

      // Физика Президента
      if (president.saved) {
        president.x += president.vx * timeScale;
        president.y += president.vy * timeScale;
        president.angle += president.vRot * timeScale;
        president.vx *= 0.94;
        president.vy *= 0.94;
        president.vRot *= 0.95;

        if (!podium.destroyed && 
            Math.abs(president.x - podium.x) < podium.w / 2 + president.r &&
            Math.abs(president.y - podium.y) < podium.h / 2 + president.r) {
          destroyPodium();
        }
      }

      // Пули и их столкновения
      if (gameState === 'SHOT') {
        let activeBullets = 0;

        bullets.forEach(b => {
          if (!b.active) return;
          b.x += b.vx * timeScale;
          b.y += b.vy * timeScale;
          activeBullets++;

          // Пуля попадает в трибуну
          if (!podium.destroyed && 
              Math.abs(b.x - podium.x) < podium.w / 2 &&
              Math.abs(b.y - podium.y) < podium.h / 2) {
            b.active = false;
            createHitParticles(b.x, b.y, '#854d0e', 8);
            return;
          }

          // Попадание в телохранителя
          const distGuard = Math.hypot(b.x - guard.x, b.y - guard.y);
          if (distGuard < b.r + guard.r) {
            b.active = false;
            createHitParticles(b.x, b.y, '#ef4444', 16);
            winLevel("ВЫ ПРИНЯЛИ ПУЛЮ НА СЕБЯ!");
            return;
          }

          // Попадание в президента
          const distPres = Math.hypot(b.x - president.x, b.y - president.y);
          if (distPres < b.r + president.r) {
            b.active = false;
            president.hit = true;
            createHitParticles(b.x, b.y, '#dc2626', 20);
            failLevel("ПРЕЗИДЕНТ УБИТ!");
            return;
          }

          if (b.y > height || b.x < 0 || b.x > width) b.active = false;
        });

        if (activeBullets === 0 && gameState === 'SHOT') {
          if (president.saved) winLevel("ПРЕЗИДЕНТ УСПЕШНО СПАСЕН!");
          else failLevel("СНАЙПЕР ПОПАЛ В ЦЕЛЬ!");
        }
      }

      // Обновление частиц и обломков
      particles.forEach((p, idx) => {
        p.x += p.vx * timeScale;
        p.y += p.vy * timeScale;
        p.life -= dt * 1.5;
        if (p.life <= 0) particles.splice(idx, 1);
      });

      debris.forEach((d, idx) => {
        d.x += d.vx * timeScale;
        d.y += d.vy * timeScale;
        d.angle += d.vRot * timeScale;
        d.life -= dt;
        if (d.life <= 0) debris.splice(idx, 1);
      });
    }

    function winLevel(reason) {
      gameState = 'WIN';
      wins++;
      scoreEl.innerText = `Побед: ${wins}`;
      titleEl.innerText = "УСПЕХ!";
      titleEl.className = "win";
      descEl.innerText = reason;
      mainBtn.innerText = "СЛЕДУЮЩИЙ УРОВЕНЬ";
      overlayEl.classList.remove('hidden');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }

    function failLevel(reason) {
      gameState = 'FAIL';
      titleEl.innerText = "ПРОВАЛ!";
      titleEl.className = "fail";
      descEl.innerText = reason;
      mainBtn.innerText = "ПОПРОБОВАТЬ СНОВА";
      overlayEl.classList.remove('hidden');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    }

    function nextAction() {
      if (gameState === 'WIN') {
        level++;
        levelEl.innerText = `Уровень: ${level}`;
      }
      initLevel();
    }

    function draw3DHuman(x, y, type, angle = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      // Тень
      ctx.beginPath();
      ctx.ellipse(0, 15, 20, 8, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.fill();

      if (type === 'president') {
        ctx.fillStyle = '#15803d';
        ctx.beginPath();
        ctx.roundRect(-16, -5, 32, 25, 6);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-5, -5, 10, 12);

        ctx.fillStyle = '#dc2626';
        ctx.fillRect(-2, -3, 4, 12);

        let headGrad = ctx.createRadialGradient(-3, -18, 3, 0, -15, 12);
        headGrad.addColorStop(0, '#fde047');
        headGrad.addColorStop(1, '#ca8a04');
        ctx.beginPath();
        ctx.arc(0, -15, 12, 0, Math.PI * 2);
        ctx.fillStyle = headGrad;
        ctx.fill();
      } else {
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.roundRect(-18, -6, 36, 28, 8);
        ctx.fill();

        ctx.fillStyle = '#0284c7';
        ctx.fillRect(-8, -2, 16, 18);

        let headGrad = ctx.createRadialGradient(-3, -18, 3, 0, -15, 12);
        headGrad.addColorStop(0, '#94a3b8');
        headGrad.addColorStop(1, '#334155');
        ctx.beginPath();
        ctx.arc(0, -15, 12, 0, Math.PI * 2);
        ctx.fillStyle = headGrad;
        ctx.fill();

        ctx.fillStyle = '#000000';
        ctx.fillRect(-8, -18, 16, 5);
      }

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Ковровая дорожка
      ctx.fillStyle = 'rgba(185, 28, 28, 0.2)';
      ctx.fillRect(width * 0.25, 0, width * 0.5, height);

      // Отрисовка трибуны
      if (!podium.destroyed) {
        ctx.fillStyle = '#a16207';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 10;
        ctx.fillRect(podium.x - podium.w / 2, podium.y - podium.h / 2, podium.w, podium.h);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ca8a04';
        ctx.fillRect(podium.x - podium.w / 2 + 4, podium.y - podium.h / 2 + 4, podium.w - 8, podium.h - 8);
      }

      // Обломки трибуны
      debris.forEach(d => {
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.rotate(d.angle);
        ctx.fillStyle = `rgba(161, 98, 7, ${d.life})`;
        ctx.fillRect(-d.size/2, -d.size/2, d.size, d.size);
        ctx.restore();
      });

      // Снайперы и лазеры
      snipers.forEach(s => {
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(s.x, s.y, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(s.x - 2, s.y, 4, 10);

        if (gameState === 'AIMING') {
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(s.targetX, s.targetY);
          ctx.strokeStyle = 'rgba(239, 68, 68, 0.6)';
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 6]);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      });

      // Вектор броска
      if (isDragging) {
        const dx = dragStart.x - dragCurrent.x;
        const dy = dragStart.y - dragCurrent.y;
        ctx.beginPath();
        ctx.moveTo(guard.x, guard.y);
        ctx.lineTo(guard.x + dx, guard.y + dy);
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      draw3DHuman(president.x, president.y, 'president', president.angle);
      draw3DHuman(guard.x, guard.y, 'guard', guard.angle);

      // Пули
      bullets.forEach(b => {
        if (!b.active) return;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = '#facc15';
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x - b.vx * 2, b.y - b.vy * 2);
        ctx.strokeStyle = '#f97316';
        ctx.lineWidth = 5;
        ctx.stroke();
      });

      // Частицы
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fill();
        ctx.globalAlpha = 1.0;
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    titleEl.innerText = "GET DOWN MR. PRESIDENT!";
    descEl.innerText = "Толкните телохранителя, чтобы сбить Президента с ног или закрыть его собой!";
    mainBtn.innerText = "ИГРАТЬ";
    overlayEl.classList.remove('hidden');

    loop();
  </script>
</body>
</html>
