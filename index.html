<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mr. President! Mobile Ragdoll Edition</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: 'Montserrat', sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050811;
      color: #ffffff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0b1120;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ИНТЕРФЕЙС BOLD MR. PRESIDENT STYLING */
    .ui-top {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      pointer-events: none;
    }
    .badge {
      background: #dc2626;
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      font-style: italic;
      padding: 8px 14px;
      transform: skew(-12deg);
      box-shadow: 4px 4px 0px #000;
      border: 2px solid #fff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-blue { background: #2563eb; }
    .badge-yellow { background: #f59e0b; color: #000; }

    /* ЭКРАНЫ ПОБЕДЫ И ПРОВАЛА */
    .game-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 8, 17, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      text-align: center;
      padding: 20px;
      backdrop-filter: blur(8px);
    }
    .screen-title {
      font-size: 30px;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      padding: 12px 28px;
      transform: skew(-10deg);
      box-shadow: 6px 6px 0px #000;
      margin-bottom: 16px;
      border: 3px solid #fff;
    }
    .title-win { background: #16a34a; color: #fff; }
    .title-fail { background: #dc2626; color: #fff; }
    .title-start { background: #2563eb; color: #fff; }

    .screen-desc {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 24px;
      color: #cbd5e1;
      max-width: 360px;
      line-height: 1.4;
      text-shadow: 0 2px 4px #000;
    }
    .btn-action {
      background: #f59e0b;
      color: #000;
      border: 3px solid #fff;
      padding: 16px 42px;
      font-size: 18px;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      transform: skew(-10deg);
      box-shadow: 5px 5px 0px #000;
      cursor: pointer;
    }
    .btn-action:active {
      transform: skew(-10deg) translate(2px, 2px);
      box-shadow: 3px 3px 0px #000;
    }
    .hidden { display: none !important; }

    #touch-hint {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 14px;
      font-weight: 900;
      font-style: italic;
      color: #f59e0b;
      text-shadow: 0 2px 4px #000;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="ui-top">
      <div class="badge badge-blue" id="level-text">STAGE 1</div>
      <div class="badge badge-yellow" id="timer-display">3.0s</div>
      <div class="badge" id="score-text">SAVED: 0</div>
    </div>

    <div id="touch-hint">SWIPE FAST TO DIVE & TACKLE RUMP!</div>

    <canvas id="gameCanvas"></canvas>

    <div id="overlay-screen" class="game-screen hidden">
      <div class="screen-title title-start" id="screen-title">MR. PRESIDENT!</div>
      <p class="screen-desc" id="screen-desc">Делайте прыжок в стиле «Супермена», сбивайте Президента Rump и защитите его от снайпера!</p>
      <button class="btn-action" id="main-btn" onclick="nextAction()">START MISSION</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    }

    document.body.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const levelEl = document.getElementById('level-text');
    const scoreEl = document.getElementById('score-text');
    const timerEl = document.getElementById('timer-display');
    const overlayEl = document.getElementById('overlay-screen');
    const titleEl = document.getElementById('screen-title');
    const descEl = document.getElementById('screen-desc');
    const mainBtn = document.getElementById('main-btn');

    let width, height;
    let level = 1;
    let wins = 0;
    let gameState = 'START';
    let timeScale = 1.0;
    let globalTime = 0;

    // Персонажи с физикой Ragdoll
    let president = { x: 0, y: 0, r: 24, vx: 0, vy: 0, angle: 0, vRot: 0, saved: false, hit: false, walkDir: 1, animPhase: 0, ragdoll: false };
    let guard = { x: 0, y: 0, r: 26, vx: 0, vy: 0, angle: 0, vRot: 0, flying: false, shoutTimer: 0, ragdoll: false };
    let safeZone = { x: 0, y: 0, w: 0, h: 0 };

    let snipers = [];
    let bullets = [];
    let particles = [];
    let destructibles = []; // Разрушаемые объекты (коробки, стеклянные щиты)

    let countdown = 3.0;
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let dragCurrent = { x: 0, y: 0 };

    function playAudioFx(freq, type, duration) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function createDebris(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = Math.random() * 8 + 2;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 1.2,
          size: Math.random() * 6 + 3,
          color
        });
      }
    }

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }

    window.addEventListener('resize', resize);
    resize();

    function initLevel() {
      safeZone = {
        x: width * 0.15,
        y: height * 0.08,
        w: width * 0.7,
        h: height * 0.16
      };

      president = { 
        x: width * 0.5, 
        y: height * 0.44, 
        r: 24, vx: 0, vy: 0, angle: 0, vRot: 0, 
        saved: false, hit: false, walkDir: Math.random() > 0.5 ? 1 : -1,
        animPhase: 0, ragdoll: false
      };

      guard = { 
        x: width * 0.5, 
        y: height * 0.82, 
        r: 26, vx: 0, vy: 0, angle: 0, vRot: 0, flying: false, shoutTimer: 0, ragdoll: false
      };

      // Разрушаемые баррикады и препятствия
      destructibles = [];
      const obsCount = Math.min(2 + level, 7);
      for (let i = 0; i < obsCount; i++) {
        destructibles.push({
          x: width * (0.2 + (i % 3) * 0.3),
          y: height * (0.32 + Math.floor(i / 3) * 0.18),
          w: 45,
          h: 45,
          destroyed: false,
          color: i % 2 === 0 ? '#b45309' : '#38bdf8' // Дерево или стекло
        });
      }

      snipers = [];
      const sniperCount = Math.min(1 + Math.floor(level / 2), 3);
      for (let i = 0; i < sniperCount; i++) {
        snipers.push({
          x: (width / (sniperCount + 1)) * (i + 1),
          y: 35,
          targetX: president.x,
          targetY: president.y
        });
      }

      bullets = [];
      particles = [];
      timeScale = 1.0;
      countdown = Math.max(2.2, (3.5 - level * 0.1).toFixed(1));
      gameState = 'AIMING';
      overlayEl.classList.add('hidden');
    }

    function onTouchStart(e) {
      if (gameState !== 'AIMING') return;
      const p = getPos(e);
      isDragging = true;
      dragStart = p;
      dragCurrent = p;
    }

    function onTouchMove(e) {
      if (!isDragging) return;
      dragCurrent = getPos(e);
    }

    function onTouchEnd() {
      if (!isDragging) return;
      isDragging = false;

      const dx = dragStart.x - dragCurrent.x;
      const dy = dragStart.y - dragCurrent.y;
      const force = Math.min(Math.hypot(dx, dy) * 0.28, 36);
      
      if (force > 3) {
        const angle = Math.atan2(dy, dx);
        guard.vx = Math.cos(angle) * force;
        guard.vy = Math.sin(angle) * force;
        guard.vRot = (Math.random() - 0.5) * 0.8;
        guard.flying = true;
        guard.ragdoll = true;
        guard.shoutTimer = 1.2;

        playAudioFx(300, 'sawtooth', 0.15);
        if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
      }
    }

    function getPos(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX, y: clientY };
    }

    canvas.addEventListener('mousedown', onTouchStart);
    canvas.addEventListener('mousemove', onTouchMove);
    window.addEventListener('mouseup', onTouchEnd);

    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', onTouchMove, { passive: false });
    window.addEventListener('touchend', onTouchEnd);

    function shootSnipers() {
      gameState = 'SHOT';
      playAudioFx(150, 'square', 0.3);

      snipers.forEach(s => {
        const angle = Math.atan2(s.targetY - s.y, s.targetX - s.x);
        bullets.push({
          x: s.x,
          y: s.y,
          vx: Math.cos(angle) * 26,
          vy: Math.sin(angle) * 26,
          r: 5,
          active: true
        });
      });

      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
    }

    function update() {
      globalTime += 0.05;

      // Slow-Motion эффекты
      if (gameState === 'SHOT') timeScale = 0.25;
      else if (guard.flying && countdown < 1.0) timeScale = 0.4;
      else timeScale = 1.0;

      const dt = (1 / 60) * timeScale;
      if (guard.shoutTimer > 0) guard.shoutTimer -= dt;

      if (gameState === 'AIMING') {
        countdown -= dt;
        
        if (!president.ragdoll) {
          president.x += president.walkDir * 0.9;
          president.animPhase += 0.15;
          if (president.x < width * 0.22 || president.x > width * 0.78) {
            president.walkDir *= -1;
          }
        }

        snipers.forEach(s => {
          s.targetX = president.x + Math.sin(globalTime * 3) * 10;
          s.targetY = president.y + Math.cos(globalTime * 3) * 10;
        });

        if (president.saved && (president.x >= safeZone.x && president.x <= safeZone.x + safeZone.w &&
                               president.y >= safeZone.y && president.y <= safeZone.y + safeZone.h)) {
          winLevel("PRESIDENT RUMP EVACUATED TO SAFETY!");
          return;
        }

        if (countdown <= 0) {
          countdown = 0;
          timerEl.innerText = "0.0s";
          shootSnipers();
        } else {
          timerEl.innerText = countdown.toFixed(1) + "s";
        }
      }

      // Физика Телохранителя
      if (guard.flying || Math.hypot(guard.vx, guard.vy) > 0.1) {
        guard.x += guard.vx * timeScale;
        guard.y += guard.vy * timeScale;
        guard.angle += guard.vRot * timeScale;
        guard.vx *= 0.98;
        guard.vy *= 0.98;

        // Разрушение препятствий телохранителем
        destructibles.forEach(d => {
          if (!d.destroyed && Math.abs(guard.x - d.x) < d.w/2 + guard.r && Math.abs(guard.y - d.y) < d.h/2 + guard.r) {
            d.destroyed = true;
            createDebris(d.x, d.y, d.color, 16);
            playAudioFx(400, 'triangle', 0.1);
          }
        });

        // Столкновение с Президентом
        const distPres = Math.hypot(guard.x - president.x, guard.y - president.y);
        if (distPres < guard.r + president.r) {
          if (!president.saved) {
            createDebris((guard.x + president.x)/2, (guard.y + president.y)/2, '#f59e0b', 12);
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('rigid');
          }
          president.saved = true;
          president.ragdoll = true;
          const hitAngle = Math.atan2(president.y - guard.y, president.x - guard.x);
          const force = Math.max(Math.hypot(guard.vx, guard.vy), 16);
          
          president.vx = Math.cos(hitAngle) * force * 1.15;
          president.vy = Math.sin(hitAngle) * force * 1.15;
          president.vRot = (Math.random() - 0.5) * 1.2;

          guard.vx *= 0.35;
          guard.vy *= 0.35;
        }
      }

      // Физика Президента
      if (president.ragdoll) {
        president.x += president.vx * timeScale;
        president.y += president.vy * timeScale;
        president.angle += president.vRot * timeScale;
        president.vx *= 0.96;
        president.vy *= 0.96;

        destructibles.forEach(d => {
          if (!d.destroyed && Math.abs(president.x - d.x) < d.w/2 + president.r && Math.abs(president.y - d.y) < d.h/2 + president.r) {
            d.destroyed = true;
            createDebris(d.x, d.y, d.color, 16);
          }
        });
      }

      // Пули и попадания
      if (gameState === 'SHOT') {
        bullets.forEach(b => {
          if (!b.active) return;
          b.x += b.vx * timeScale;
          b.y += b.vy * timeScale;

          // Спасение телом
          if (Math.hypot(b.x - guard.x, b.y - guard.y) < b.r + guard.r) {
            b.active = false;
            createDebris(b.x, b.y, '#ef4444', 20);
            winLevel("BODYGUARD TOOK THE BULLET!");
            return;
          }

          // Президент застрелен
          if (Math.hypot(b.x - president.x, b.y - president.y) < b.r + president.r) {
            b.active = false;
            createDebris(b.x, b.y, '#dc2626', 25);
            failLevel("PRESIDENT RUMP WAS SHOT!");
            return;
          }
        });
      }

      particles.forEach((p, idx) => {
        p.x += p.vx * timeScale;
        p.y += p.vy * timeScale;
        p.life -= dt * 1.8;
        if (p.life <= 0) particles.splice(idx, 1);
      });
    }

    function winLevel(reason) {
      gameState = 'WIN';
      wins++;
      scoreEl.innerText = `SAVED: ${wins}`;
      titleEl.innerText = "LEVEL PASSED!";
      titleEl.className = "screen-title title-win";
      descEl.innerText = reason;
      mainBtn.innerText = "NEXT STAGE";
      overlayEl.classList.remove('hidden');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }

    function failLevel(reason) {
      gameState = 'FAIL';
      titleEl.innerText = "ASSASSINATED!";
      titleEl.className = "screen-title title-fail";
      descEl.innerText = reason;
      mainBtn.innerText = "TRY AGAIN";
      overlayEl.classList.remove('hidden');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    }

    function nextAction() {
      if (gameState === 'WIN') {
        level++;
        levelEl.innerText = `STAGE ${level}`;
      }
      initLevel();
    }

    // Отрисовка
    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Задний фон подиума
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, width, height);

      // Красный ковер
      ctx.fillStyle = '#991b1b';
      ctx.fillRect(width * 0.2, 0, width * 0.6, height);

      // Безопасная зона эвакуации
      ctx.fillStyle = 'rgba(37, 99, 235, 0.3)';
      ctx.strokeStyle = '#60a5fa';
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 6]);
      ctx.fillRect(safeZone.x, safeZone.y, safeZone.w, safeZone.h);
      ctx.strokeRect(safeZone.x, safeZone.y, safeZone.w, safeZone.h);
      ctx.setLineDash([]);

      // Разрушаемые объекты
      destructibles.forEach(d => {
        if (d.destroyed) return;
        ctx.fillStyle = d.color;
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 6;
        ctx.fillRect(d.x - d.w/2, d.y - d.h/2, d.w, d.h);
        ctx.shadowBlur = 0;
      });

      // Прицел снайпера
      snipers.forEach(s => {
        if (gameState === 'AIMING') {
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(s.targetX, s.targetY);
          ctx.strokeStyle = 'rgba(239, 68, 68, 0.8)';
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 6]);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      });

      // Вектор броска
      if (isDragging) {
        const dx = dragStart.x - dragCurrent.x;
        const dy = dragStart.y - dragCurrent.y;
        ctx.beginPath();
        ctx.moveTo(guard.x, guard.y);
        ctx.lineTo(guard.x + dx, guard.y + dy);
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 5;
        ctx.stroke();
      }

      // Персонажи
      drawCharacter(president.x, president.y, 'president', president.angle, president.ragdoll, president.animPhase);
      drawCharacter(guard.x, guard.y, 'guard', guard.angle, guard.ragdoll, 0);

      // Выкрик "GET DOWN!"
      if (guard.shoutTimer > 0) {
        ctx.save();
        ctx.translate(guard.x, guard.y - 48);
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(-55, -18, 110, 32, 8);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#dc2626';
        ctx.font = '900 13px Montserrat, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("GET DOWN!", 0, 3);
        ctx.restore();
      }

      // Пули с трассером
      bullets.forEach(b => {
        if (!b.active) return;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = '#facc15';
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x - b.vx * 3, b.y - b.vy * 3);
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 4;
        ctx.stroke();
      });

      // Осколки
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, p.size || 4, p.size || 4);
        ctx.globalAlpha = 1.0;
      });
    }

    function drawCharacter(x, y, type, angle, isRagdoll, walkPhase) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      // Тень
      ctx.beginPath();
      ctx.ellipse(0, 15, 18, 7, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.fill();

      if (type === 'president') {
        // Президент Rump
        ctx.fillStyle = '#1e3a8a';
        ctx.fillRect(-15, -6, 30, 22); // Костюм
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(-2, -4, 4, 12); // Галстук

        // Голова и желтые волосы
        ctx.beginPath();
        ctx.arc(0, -14, 12, 0, Math.PI * 2);
        ctx.fillStyle = '#facc15';
        ctx.fill();
      } else {
        // Телохранитель Dick Johnson
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-16, -6, 32, 24); // Черный костюм
        ctx.fillStyle = '#2563eb';
        ctx.fillRect(-6, -2, 12, 12);

        // Голова и очки
        ctx.beginPath();
        ctx.arc(0, -14, 11, 0, Math.PI * 2);
        ctx.fillStyle = '#fdba74';
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.fillRect(-7, -16, 14, 4); // Очки
      }

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    titleEl.innerText = "MR. PRESIDENT!";
    descEl.innerText = "Сбивайте Президента Rump, совершайте прыжки и спасайте его от снайперов!";
    mainBtn.innerText = "PLAY";
    overlayEl.classList.remove('hidden');

    loop();
  </script>
</body>
</html>
