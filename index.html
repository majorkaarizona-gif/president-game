<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mr. President 3D</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 450px;
      max-height: 800px;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .ui-layer {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: 800;
      color: #f8fafc;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    #timer-display {
      color: #ef4444;
      font-size: 22px;
    }
    .game-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 10;
      text-align: center;
      padding: 24px;
      backdrop-filter: blur(5px);
    }
    .game-screen h1 {
      font-size: 28px;
      margin-bottom: 12px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .game-screen h1.win { color: #22c55e; }
    .game-screen h1.fail { color: #ef4444; }
    .game-screen p {
      font-size: 16px;
      margin-bottom: 25px;
      color: #cbd5e1;
      line-height: 1.4;
    }
    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 14px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
      transition: transform 0.1s;
    }
    .btn:active {
      transform: scale(0.95);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="ui-layer">
      <div id="level-text">Уровень: 1</div>
      <div id="timer-display">5.0s</div>
      <div id="score-text">Побед: 0</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="overlay-screen" class="game-screen hidden">
      <h1 id="screen-title">СПАСИТЕ ПРЕЗИДЕНТА!</h1>
      <p id="screen-desc">Снайпер выстрелит ровно через 5 секунд! Оттяните телохранителя и запрыгните в президента, чтобы сбить его с ног или закрыть собой!</p>
      <button class="btn" id="main-btn" onclick="nextAction()">НАЧАТЬ</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const levelEl = document.getElementById('level-text');
    const scoreEl = document.getElementById('score-text');
    const timerEl = document.getElementById('timer-display');
    const overlayEl = document.getElementById('overlay-screen');
    const titleEl = document.getElementById('screen-title');
    const descEl = document.getElementById('screen-desc');
    const mainBtn = document.getElementById('main-btn');

    let width, height;
    let level = 1;
    let wins = 0;
    let gameState = 'START';

    // Фиксированная цель снайпера
    let targetPoint = { x: 0, y: 0 };
    let president = { x: 0, y: 0, r: 20, saved: false, hit: false, vx: 0, vy: 0 };
    let guard = { x: 0, y: 0, r: 22, vx: 0, vy: 0, flying: false };
    let sniper = { x: 0, y: 0 };
    let bullet = { x: 0, y: 0, vx: 0, vy: 0, r: 6, active: false };

    let countdown = 5.0; // Ровно 5 секунд
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let dragCurrent = { x: 0, y: 0 };

    // Звуковой эффект выстрела (Web Audio API)
    function playGunshotSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = audioCtx.sampleRate * 0.4;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start();
      } catch (e) {
        console.log("Audio not supported");
      }
    }

    function resize() {
      const container = document.getElementById('game-container');
      width = container.clientWidth;
      height = container.clientHeight;
      canvas.width = width;
      canvas.height = height;
    }

    window.addEventListener('resize', resize);
    resize();

    function initLevel() {
      president = { 
        x: width * 0.5, 
        y: height * 0.38, 
        r: 20, saved: false, hit: false, vx: 0, vy: 0 
      };

      // Фиксируем прицел на начальную позицию президента
      targetPoint = { x: president.x, y: president.y };

      guard = { 
        x: width * 0.5, 
        y: height * 0.78, 
        r: 22, vx: 0, vy: 0, flying: false 
      };

      sniper = { x: width * 0.5 + (Math.random() * 240 - 120), y: 40 };
      bullet = { x: 0, y: 0, vx: 0, vy: 0, r: 6, active: false };

      countdown = 5.0;
      gameState = 'AIMING';
      overlayEl.classList.add('hidden');
    }

    // Управление прыжком
    function onTouchStart(e) {
      if (gameState !== 'AIMING' || guard.flying) return;
      const p = getPos(e);
      const dist = Math.hypot(p.x - guard.x, p.y - guard.y);
      if (dist < guard.r * 2.5) {
        isDragging = true;
        dragStart = { x: guard.x, y: guard.y };
        dragCurrent = p;
      }
    }

    function onTouchMove(e) {
      if (!isDragging) return;
      dragCurrent = getPos(e);
    }

    function onTouchEnd() {
      if (!isDragging) return;
      isDragging = false;

      const dx = dragStart.x - dragCurrent.x;
      const dy = dragStart.y - dragCurrent.y;
      const force = Math.min(Math.hypot(dx, dy) * 0.18, 25);
      const angle = Math.atan2(dy, dx);

      guard.vx = Math.cos(angle) * force;
      guard.vy = Math.sin(angle) * force;
      guard.flying = true;

      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    canvas.addEventListener('mousedown', onTouchStart);
    canvas.addEventListener('mousemove', onTouchMove);
    window.addEventListener('mouseup', onTouchEnd);

    canvas.addEventListener('touchstart', onTouchStart);
    canvas.addEventListener('touchmove', onTouchMove);
    window.addEventListener('touchend', onTouchEnd);

    function shootSniper() {
      gameState = 'SHOT';
      playGunshotSound();

      bullet.x = sniper.x;
      bullet.y = sniper.y;

      // Пуля летит ровно в ФИКСИРОВАННУЮ начальную точку
      const angle = Math.atan2(targetPoint.y - sniper.y, targetPoint.x - sniper.x);
      const speed = 22;
      bullet.vx = Math.cos(angle) * speed;
      bullet.vy = Math.sin(angle) * speed;
      bullet.active = true;

      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
    }

    function update() {
      // Отсчет 5 секунд
      if (gameState === 'AIMING') {
        countdown -= 1 / 60;
        if (countdown <= 0) {
          countdown = 0;
          timerEl.innerText = "0.0s";
          shootSniper();
        } else {
          timerEl.innerText = countdown.toFixed(1) + "s";
        }
      }

      // Полет телохранителя
      if (guard.flying) {
        guard.x += guard.vx;
        guard.y += guard.vy;
        guard.vx *= 0.98;
        guard.vy *= 0.98;

        // Физика столкновения с президентом (сбиваем с ног)
        const distPres = Math.hypot(guard.x - president.x, guard.y - president.y);
        if (distPres < guard.r + president.r) {
          president.saved = true;
          president.vx = guard.vx * 0.85;
          president.vy = guard.vy * 0.85;
        }
      }

      // Движение сбитого президента
      if (president.saved) {
        president.x += president.vx;
        president.y += president.vy;
        president.vx *= 0.93;
        president.vy *= 0.93;
      }

      // Движение пули
      if (bullet.active) {
        bullet.x += bullet.vx;
        bullet.y += bullet.vy;

        // Попадание в телохранителя
        const distGuard = Math.hypot(bullet.x - guard.x, bullet.y - guard.y);
        if (distGuard < bullet.r + guard.r) {
          bullet.active = false;
          winLevel("ВЫ ПРИНЯЛИ ПУЛЮ НА СЕБЯ!");
          return;
        }

        // Попадание в президента
        const distPres = Math.hypot(bullet.x - president.x, bullet.y - president.y);
        if (distPres < bullet.r + president.r) {
          bullet.active = false;
          president.hit = true;
          failLevel("ПРЕЗИДЕНТ УБИТ!");
          return;
        }

        // Пуля пролетела мимо
        if (bullet.y > height || bullet.x < 0 || bullet.x > width) {
          bullet.active = false;
          if (president.saved) {
            winLevel("ПРЕЗИДЕНТ УСПЕШНО СПАСЕН!");
          } else {
            failLevel("СНАЙПЕР ПОПАЛ В ЦЕЛЬ!");
          }
        }
      }
    }

    function winLevel(reason) {
      gameState = 'WIN';
      wins++;
      scoreEl.innerText = `Побед: ${wins}`;
      titleEl.innerText = "УСПЕХ!";
      titleEl.className = "win";
      descEl.innerText = reason;
      mainBtn.innerText = "СЛЕДУЮЩИЙ УРОВЕНЬ";
      overlayEl.classList.remove('hidden');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }

    function failLevel(reason) {
      gameState = 'FAIL';
      titleEl.innerText = "ПРОВАЛ!";
      titleEl.className = "fail";
      descEl.innerText = reason;
      mainBtn.innerText = "ПОПРОБОВАТЬ СНОВА";
      overlayEl.classList.remove('hidden');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    }

    function nextAction() {
      if (gameState === 'WIN') {
        level++;
        levelEl.innerText = `Уровень: ${level}`;
      }
      initLevel();
    }

    // 3D-отрисовка персонажей
    function draw3DCharacter(x, y, r, type) {
      // Тень под персонажем
      ctx.beginPath();
      ctx.ellipse(x, y + r * 0.8, r * 0.9, r * 0.3, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.fill();

      // Градиент объема (3D шар/голова)
      let grad = ctx.createRadialGradient(
        x - r * 0.3, y - r * 0.3, r * 0.1,
        x, y, r
      );

      if (type === 'president') {
        grad.addColorStop(0, '#86efac');
        grad.addColorStop(0.7, '#16a34a');
        grad.addColorStop(1, '#052e16');
      } else if (type === 'guard') {
        grad.addColorStop(0, '#94a3b8');
        grad.addColorStop(0.7, '#334155');
        grad.addColorStop(1, '#0f172a');
      }

      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // Детали костюма
      if (type === 'president') {
        // Красный галстук
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(x - 2, y - 4, 4, 12);
      } else if (type === 'guard') {
        // Очки и микрофон
        ctx.fillStyle = '#000';
        ctx.fillRect(x - 8, y - 5, 16, 5);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, r + 2, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Ковровая дорожка
      ctx.fillStyle = 'rgba(185, 28, 28, 0.25)';
      ctx.fillRect(width * 0.2, 0, width * 0.6, height);

      // Снайпер
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(sniper.x, sniper.y, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(sniper.x - 2, sniper.y, 4, 10);

      // Фиксированный лазерный прицел
      if (gameState === 'AIMING') {
        ctx.beginPath();
        ctx.moveTo(sniper.x, sniper.y);
        ctx.lineTo(targetPoint.x, targetPoint.y);
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.6)';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Крестик прицела
        ctx.beginPath();
        ctx.arc(targetPoint.x, targetPoint.y, 10, 0, Math.PI * 2);
        ctx.strokeStyle = '#ef4444';
        ctx.stroke();
      }

      // Линия броска
      if (isDragging) {
        ctx.beginPath();
        ctx.moveTo(guard.x, guard.y);
        ctx.lineTo(guard.x + (dragStart.x - dragCurrent.x), guard.y + (dragStart.y - dragCurrent.y));
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      // Отрисовка 3D Президента и Телохранителя
      draw3DCharacter(president.x, president.y, president.r, 'president');
      draw3DCharacter(guard.x, guard.y, guard.r, 'guard');

      // Летит пуля
      if (bullet.active) {
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.r, 0, Math.PI * 2);
        ctx.fillStyle = '#facc15';
        ctx.fill();

        // Огненный шлейф
        ctx.beginPath();
        ctx.moveTo(bullet.x, bullet.y);
        ctx.lineTo(bullet.x - bullet.vx * 2, bullet.y - bullet.vy * 2);
        ctx.strokeStyle = '#f97316';
        ctx.lineWidth = 5;
        ctx.stroke();
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    titleEl.innerText = "GET DOWN MR. PRESIDENT!";
    descEl.innerText = "У вас есть 5 секунд! Оттяните телохранителя пальцем и запрыгните в президента, чтобы сбить его с прицела или принять пулю!";
    mainBtn.innerText = "ИГРАТЬ";
    overlayEl.classList.remove('hidden');

    loop();
  </script>
</body>
</html>
