<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mr. President 3D Action</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 450px;
      max-height: 800px;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .ui-layer {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: 800;
      color: #f8fafc;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    #timer-display {
      color: #ef4444;
      font-size: 22px;
    }
    .game-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 10;
      text-align: center;
      padding: 24px;
      backdrop-filter: blur(5px);
    }
    .game-screen h1 {
      font-size: 28px;
      margin-bottom: 12px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .game-screen h1.win { color: #22c55e; }
    .game-screen h1.fail { color: #ef4444; }
    .game-screen p {
      font-size: 16px;
      margin-bottom: 25px;
      color: #cbd5e1;
      line-height: 1.4;
    }
    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 14px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
      transition: transform 0.1s;
    }
    .btn:active {
      transform: scale(0.95);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="ui-layer">
      <div id="level-text">Уровень: 1</div>
      <div id="timer-display">3.0s</div>
      <div id="score-text">Побед: 0</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="overlay-screen" class="game-screen hidden">
      <h1 id="screen-title">СПАСИТЕ ПРЕЗИДЕНТА!</h1>
      <p id="screen-desc">Снайперы готовят выстрел! Запрыгните в президента, чтобы сбить его с ног или закрыть собой!</p>
      <button class="btn" id="main-btn" onclick="nextAction()">НАЧАТЬ</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const levelEl = document.getElementById('level-text');
    const scoreEl = document.getElementById('score-text');
    const timerEl = document.getElementById('timer-display');
    const overlayEl = document.getElementById('overlay-screen');
    const titleEl = document.getElementById('screen-title');
    const descEl = document.getElementById('screen-desc');
    const mainBtn = document.getElementById('main-btn');

    let width, height;
    let level = 1;
    let wins = 0;
    let gameState = 'START';

    let targetPoint = { x: 0, y: 0 };
    let president = { x: 0, y: 0, r: 22, saved: false, hit: false, vx: 0, vy: 0 };
    let guard = { x: 0, y: 0, r: 24, vx: 0, vy: 0, flying: false, angle: 0 };
    
    let snipers = [];
    let bullets = [];

    let countdown = 3.0;
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let dragCurrent = { x: 0, y: 0 };

    function playGunshotSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = audioCtx.sampleRate * 0.3;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.25);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
      } catch (e) {}
    }

    function resize() {
      const container = document.getElementById('game-container');
      width = container.clientWidth;
      height = container.clientHeight;
      canvas.width = width;
      canvas.height = height;
    }

    window.addEventListener('resize', resize);
    resize();

    function initLevel() {
      president = { 
        x: width * 0.5, 
        y: height * 0.4, 
        r: 22, saved: false, hit: false, vx: 0, vy: 0 
      };

      targetPoint = { x: president.x, y: president.y };

      // Спавн телохранителя с разных сторон (слева, справа, внизу)
      const spawnSides = [
        { x: width * 0.2, y: height * 0.75 },
        { x: width * 0.8, y: height * 0.75 },
        { x: width * 0.15, y: height * 0.45 },
        { x: width * 0.85, y: height * 0.45 },
        { x: width * 0.5, y: height * 0.8 }
      ];
      const randomSpawn = spawnSides[Math.floor(Math.random() * spawnSides.length)];

      guard = { 
        x: randomSpawn.x, 
        y: randomSpawn.y, 
        r: 24, vx: 0, vy: 0, flying: false, angle: 0 
      };

      // Спавн снайперов в зависимости от уровня (1 до 3+)
      snipers = [];
      const sniperCount = Math.min(1 + Math.floor((level - 1) / 2), 3);
      for (let i = 0; i < sniperCount; i++) {
        snipers.push({
          x: (width / (sniperCount + 1)) * (i + 1) + (Math.random() * 40 - 20),
          y: 40 + Math.random() * 20
        });
      }

      bullets = [];

      // Время выстрела меняется рандомно
      countdown = Math.max(1.5, (3.5 - Math.random() * 1.5).toFixed(1));
      gameState = 'AIMING';
      overlayEl.classList.add('hidden');
    }

    function onTouchStart(e) {
      if (gameState !== 'AIMING' || guard.flying) return;
      const p = getPos(e);
      const dist = Math.hypot(p.x - guard.x, p.y - guard.y);
      if (dist < guard.r * 2.5) {
        isDragging = true;
        dragStart = { x: guard.x, y: guard.y };
        dragCurrent = p;
      }
    }

    function onTouchMove(e) {
      if (!isDragging) return;
      dragCurrent = getPos(e);
    }

    function onTouchEnd() {
      if (!isDragging) return;
      isDragging = false;

      const dx = dragStart.x - dragCurrent.x;
      const dy = dragStart.y - dragCurrent.y;
      const force = Math.min(Math.hypot(dx, dy) * 0.18, 25);
      const angle = Math.atan2(dy, dx);

      guard.vx = Math.cos(angle) * force;
      guard.vy = Math.sin(angle) * force;
      guard.angle = angle;
      guard.flying = true;

      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    canvas.addEventListener('mousedown', onTouchStart);
    canvas.addEventListener('mousemove', onTouchMove);
    window.addEventListener('mouseup', onTouchEnd);

    canvas.addEventListener('touchstart', onTouchStart);
    canvas.addEventListener('touchmove', onTouchMove);
    window.addEventListener('touchend', onTouchEnd);

    function shootSnipers() {
      gameState = 'SHOT';
      playGunshotSound();

      snipers.forEach(s => {
        const angle = Math.atan2(targetPoint.y - s.y, targetPoint.x - s.x);
        const speed = 22;
        bullets.push({
          x: s.x,
          y: s.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: 6,
          active: true
        });
      });

      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
    }

    function update() {
      if (gameState === 'AIMING') {
        countdown -= 1 / 60;
        if (countdown <= 0) {
          countdown = 0;
          timerEl.innerText = "0.0s";
          shootSnipers();
        } else {
          timerEl.innerText = countdown.toFixed(1) + "s";
        }
      }

      if (guard.flying) {
        guard.x += guard.vx;
        guard.y += guard.vy;
        guard.vx *= 0.98;
        guard.vy *= 0.98;

        const distPres = Math.hypot(guard.x - president.x, guard.y - president.y);
        if (distPres < guard.r + president.r) {
          president.saved = true;
          president.vx = guard.vx * 0.85;
          president.vy = guard.vy * 0.85;
        }
      }

      if (president.saved) {
        president.x += president.vx;
        president.y += president.vy;
        president.vx *= 0.93;
        president.vy *= 0.93;
      }

      if (gameState === 'SHOT') {
        let activeBullets = 0;

        bullets.forEach(b => {
          if (!b.active) return;
          b.x += b.vx;
          b.y += b.vy;
          activeBullets++;

          const distGuard = Math.hypot(b.x - guard.x, b.y - guard.y);
          if (distGuard < b.r + guard.r) {
            b.active = false;
            winLevel("ВЫ ПРИНЯЛИ ПУЛЮ НА СЕБЯ!");
            return;
          }

          const distPres = Math.hypot(b.x - president.x, b.y - president.y);
          if (distPres < b.r + president.r) {
            b.active = false;
            president.hit = true;
            failLevel("ПРЕЗИДЕНТ УБИТ!");
            return;
          }

          if (b.y > height || b.x < 0 || b.x > width) {
            b.active = false;
          }
        });

        if (activeBullets === 0 && gameState === 'SHOT') {
          if (president.saved) {
            winLevel("ПРЕЗИДЕНТ УСПЕШНО СПАСЕН!");
          } else {
            failLevel("СНАЙПЕР ПОПАЛ В ЦЕЛЬ!");
          }
        }
      }
    }

    function winLevel(reason) {
      gameState = 'WIN';
      wins++;
      scoreEl.innerText = `Побед: ${wins}`;
      titleEl.innerText = "УСПЕХ!";
      titleEl.className = "win";
      descEl.innerText = reason;
      mainBtn.innerText = "СЛЕДУЮЩИЙ УРОВЕНЬ";
      overlayEl.classList.remove('hidden');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }

    function failLevel(reason) {
      gameState = 'FAIL';
      titleEl.innerText = "ПРОВАЛ!";
      titleEl.className = "fail";
      descEl.innerText = reason;
      mainBtn.innerText = "ПОПРОБОВАТЬ СНОВА";
      overlayEl.classList.remove('hidden');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    }

    function nextAction() {
      if (gameState === 'WIN') {
        level++;
        levelEl.innerText = `Уровень: ${level}`;
      }
      initLevel();
    }

    // 3D Модели персонажей (Президент и Охранник с туловищем и костюмом)
    function draw3DHuman(x, y, type, angle = 0) {
      ctx.save();
      ctx.translate(x, y);
      if (angle !== 0) ctx.rotate(angle + Math.PI / 2);

      // Тень под телом
      ctx.beginPath();
      ctx.ellipse(0, 15, 20, 8, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.fill();

      if (type === 'president') {
        // Костюм Президент (зеленый/темный пиджак)
        ctx.fillStyle = '#15803d';
        ctx.beginPath();
        ctx.roundRect(-16, -5, 32, 25, 6);
        ctx.fill();

        // Рубашка
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-5, -5, 10, 12);

        // Красный галстук
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(-2, -3, 4, 12);

        // Голова
        let headGrad = ctx.createRadialGradient(-3, -18, 3, 0, -15, 12);
        headGrad.addColorStop(0, '#fde047');
        headGrad.addColorStop(1, '#ca8a04');
        ctx.beginPath();
        ctx.arc(0, -15, 12, 0, Math.PI * 2);
        ctx.fillStyle = headGrad;
        ctx.fill();
      } 
      else if (type === 'guard') {
        // Костюм Телохранитель (темно-синий спецназ)
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.roundRect(-18, -6, 36, 28, 8);
        ctx.fill();

        // Бронежилет / Опознаватель
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(-8, -2, 16, 18);

        // Голова
        let headGrad = ctx.createRadialGradient(-3, -18, 3, 0, -15, 12);
        headGrad.addColorStop(0, '#94a3b8');
        headGrad.addColorStop(1, '#334155');
        ctx.beginPath();
        ctx.arc(0, -15, 12, 0, Math.PI * 2);
        ctx.fillStyle = headGrad;
        ctx.fill();

        // Очки и Гарнитура
        ctx.fillStyle = '#000000';
        ctx.fillRect(-8, -18, 16, 5);
      }

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Дорожка
      ctx.fillStyle = 'rgba(185, 28, 28, 0.2)';
      ctx.fillRect(width * 0.2, 0, width * 0.6, height);

      // Снайперы
      snipers.forEach(s => {
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(s.x, s.y, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(s.x - 2, s.y, 4, 10);

        // Лазеры
        if (gameState === 'AIMING') {
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(targetPoint.x, targetPoint.y);
          ctx.strokeStyle = 'rgba(239, 68, 68, 0.6)';
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 6]);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      });

      // Линия броска
      if (isDragging) {
        ctx.beginPath();
        ctx.moveTo(guard.x, guard.y);
        ctx.lineTo(guard.x + (dragStart.x - dragCurrent.x), guard.y + (dragStart.y - dragCurrent.y));
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      // Отрисовка 3D персонажей
      draw3DHuman(president.x, president.y, 'president');
      draw3DHuman(guard.x, guard.y, 'guard', guard.angle);

      // Пули
      bullets.forEach(b => {
        if (!b.active) return;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = '#facc15';
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x - b.vx * 2, b.y - b.vy * 2);
        ctx.strokeStyle = '#f97316';
        ctx.lineWidth = 5;
        ctx.stroke();
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    titleEl.innerText = "GET DOWN MR. PRESIDENT!";
    descEl.innerText = "Снайперы наготове! Оттяните телохранителя пальцем и прыгайте, чтобы защитить президента!";
    mainBtn.innerText = "ИГРАТЬ";
    overlayEl.classList.remove('hidden');

    loop();
  </script>
</body>
</html>
