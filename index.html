<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GET DOWN MR. PRESIDENT!</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0d1117;
      color: #ffffff;
      font-family: 'Impact', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 450px;
      max-height: 800px;
      background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .ui-layer {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      letter-spacing: 1px;
      color: #f3f4f6;
      pointer-events: none;
      text-shadow: 2px 2px 0px #000;
    }
    .game-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 10;
      text-align: center;
      padding: 20px;
    }
    .game-screen h1 {
      font-size: 32px;
      margin-bottom: 15px;
      text-transform: uppercase;
    }
    .game-screen h1.win { color: #22c55e; }
    .game-screen h1.fail { color: #ef4444; }
    .game-screen p {
      font-size: 18px;
      margin-bottom: 25px;
      font-family: sans-serif;
      color: #d1d5db;
    }
    .btn {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 14px 32px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 5px 0 #991b1b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #991b1b;
    }
    .hidden { display: none !important; }
    #drag-line {
      position: absolute;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="ui-layer">
      <div id="level-text">Уровень: 1</div>
      <div id="score-text">Побед: 0</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Экран состояния -->
    <div id="overlay-screen" class="game-screen hidden">
      <h1 id="screen-title">СПАСИТЕ ПРЕЗИДЕНТА!</h1>
      <p id="screen-desc">Свайпните телохранителя в сторону президента, чтобы перехватить пулю снайпера!</p>
      <button class="btn" id="main-btn" onclick="nextAction()">СТАРТ</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const levelEl = document.getElementById('level-text');
    const scoreEl = document.getElementById('score-text');
    const overlayEl = document.getElementById('overlay-screen');
    const titleEl = document.getElementById('screen-title');
    const descEl = document.getElementById('screen-desc');
    const mainBtn = document.getElementById('main-btn');

    let width, height;
    let level = 1;
    let wins = 0;
    let gameState = 'START'; // START, AIMING, SHOT, WIN, FAIL

    // Игровые сущности
    let president = { x: 0, y: 0, r: 18, saved: false, hit: false, vx: 0, vy: 0 };
    let guard = { x: 0, y: 0, r: 20, vx: 0, vy: 0, flying: false };
    let sniper = { x: 0, y: 0 };
    let bullet = { x: 0, y: 0, vx: 0, vy: 0, r: 5, active: false };

    let aimTimer = 0;
    let maxAimTime = 120; // Кадров до выстрела
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let dragCurrent = { x: 0, y: 0 };

    function resize() {
      const container = document.getElementById('game-container');
      width = container.clientWidth;
      height = container.clientHeight;
      canvas.width = width;
      canvas.height = height;
    }

    window.addEventListener('resize', resize);
    resize();

    function initLevel() {
      // Позиционирование предметов под уровень
      president = { 
        x: width * 0.5, 
        y: height * 0.35 + (Math.random() * 40 - 20), 
        r: 18, saved: false, hit: false, vx: 0, vy: 0 
      };

      // Телохранитель сбоку внизу
      guard = { 
        x: width * 0.2 + (Math.random() * 0.6 * width), 
        y: height * 0.75, 
        r: 20, vx: 0, vy: 0, flying: false 
      };

      // Снайпер сверху
      sniper = { x: width * 0.5 + (Math.random() * 200 - 100), y: 40 };

      bullet = { x: 0, y: 0, vx: 0, vy: 0, r: 5, active: false };

      maxAimTime = Math.max(50, 130 - level * 8); // Со временем снайпер целится быстрее
      aimTimer = maxAimTime;
      gameState = 'AIMING';
      overlayEl.classList.add('hidden');
    }

    // Управление прыжком (Drag & Release)
    function onTouchStart(e) {
      if (gameState !== 'AIMING' || guard.flying) return;
      const p = getPos(e);
      const dist = Math.hypot(p.x - guard.x, p.y - guard.y);
      if (dist < guard.r * 2.5) {
        isDragging = true;
        dragStart = { x: guard.x, y: guard.y };
        dragCurrent = p;
      }
    }

    function onTouchMove(e) {
      if (!isDragging) return;
      dragCurrent = getPos(e);
    }

    function onTouchEnd() {
      if (!isDragging) return;
      isDragging = false;

      // Сила и вектор броска
      const dx = dragStart.x - dragCurrent.x;
      const dy = dragStart.y - dragCurrent.y;
      
      const force = Math.min(Math.hypot(dx, dy) * 0.18, 22);
      const angle = Math.atan2(dy, dx);

      guard.vx = Math.cos(angle) * force;
      guard.vy = Math.sin(angle) * force;
      guard.flying = true;

      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    canvas.addEventListener('mousedown', onTouchStart);
    canvas.addEventListener('mousemove', onTouchMove);
    window.addEventListener('mouseup', onTouchEnd);

    canvas.addEventListener('touchstart', onTouchStart);
    canvas.addEventListener('touchmove', onTouchMove);
    window.addEventListener('touchend', onTouchEnd);

    function shootSniper() {
      gameState = 'SHOT';
      bullet.x = sniper.x;
      bullet.y = sniper.y;

      const angle = Math.atan2(president.y - sniper.y, president.x - sniper.x);
      const speed = 16 + level * 0.5;
      bullet.vx = Math.cos(angle) * speed;
      bullet.vy = Math.sin(angle) * speed;
      bullet.active = true;

      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
    }

    function update() {
      // Таймер прицеливания снайпера
      if (gameState === 'AIMING') {
        aimTimer--;
        if (aimTimer <= 0) {
          shootSniper();
        }
      }

      // Движение телохранителя в прыжке
      if (guard.flying) {
        guard.x += guard.vx;
        guard.y += guard.vy;
        guard.vx *= 0.98; // Трение
        guard.vy *= 0.98;

        // Коллизия: Телохранитель сбивает Президента с ног (спас его)
        const distPres = Math.hypot(guard.x - president.x, guard.y - president.y);
        if (distPres < guard.r + president.r) {
          president.saved = true;
          president.vx = guard.vx * 0.8;
          president.vy = guard.vy * 0.8;
        }
      }

      // Движение сбитого президента
      if (president.saved) {
        president.x += president.vx;
        president.y += president.vy;
        president.vx *= 0.92;
        president.vy *= 0.92;
      }

      // Движение пули
      if (bullet.active) {
        bullet.x += bullet.vx;
        bullet.y += bullet.vy;

        // 1. Пуля попала в телохранителя! (Успех)
        const distGuard = Math.hypot(bullet.x - guard.x, bullet.y - guard.y);
        if (distGuard < bullet.r + guard.r) {
          bullet.active = false;
          winLevel("ВЫ ПРИНЯЛИ ПУЛЮ НА СЕБЯ!");
          return;
        }

        // 2. Пуля попала в президента! (Провал)
        const distPres = Math.hypot(bullet.x - president.x, bullet.y - president.y);
        if (distPres < bullet.r + president.r) {
          bullet.active = false;
          president.hit = true;
          failLevel("ПРЕЗИДЕНТ УБИТ!");
          return;
        }

        // 3. Пуля улетела за экран, а президент спасен (Успех)
        if (bullet.y > height || bullet.x < 0 || bullet.x > width) {
          bullet.active = false;
          if (president.saved) {
            winLevel("ПРЕЗИДЕНТ УСПЕШНО СПАСЕН!");
          } else {
            failLevel("СНАЙПЕР ПРОМАХНУЛСЯ, НО ВЫ НЕ ЗАЩИТИЛИ ПРЕЗИДЕНТА!");
          }
        }
      }
    }

    function winLevel(reason) {
      gameState = 'WIN';
      wins++;
      scoreEl.innerText = `Побед: ${wins}`;
      titleEl.innerText = "УСПЕХ!";
      titleEl.className = "win";
      descEl.innerText = reason;
      mainBtn.innerText = "СЛЕДУЮЩИЙ УРОВЕНЬ";
      overlayEl.classList.remove('hidden');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }

    function failLevel(reason) {
      gameState = 'FAIL';
      titleEl.innerText = "ПРОВАЛ!";
      titleEl.className = "fail";
      descEl.innerText = reason;
      mainBtn.innerText = "ПОПРОБОВАТЬ СНОВА";
      overlayEl.classList.remove('hidden');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    }

    function nextAction() {
      if (gameState === 'WIN') {
        level++;
        levelEl.innerText = `Уровень: ${level}`;
      }
      initLevel();
    }

    // Отрисовка игры
    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Рисуем ковровую дорожку / Сцену
      ctx.fillStyle = '#b91c1c';
      ctx.fillRect(width * 0.25, 0, width * 0.5, height);

      // Рисуем Снайпера
      ctx.fillStyle = '#000';
      ctx.fillRect(sniper.x - 12, sniper.y - 12, 24, 24);
      ctx.fillStyle = '#ef4444';
      ctx.font = '12px sans-serif';
      ctx.fillText('СНАЙПЕР', sniper.x - 26, sniper.y - 18);

      // Лазерный прицел снайпера
      if (gameState === 'AIMING') {
        ctx.beginPath();
        ctx.moveTo(sniper.x, sniper.y);
        ctx.lineTo(president.x, president.y);
        ctx.strokeStyle = `rgba(239, 68, 68, ${0.3 + (1 - aimTimer / maxAimTime) * 0.7})`;
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Линия натягивания прыжка (подсказка)
      if (isDragging) {
        ctx.beginPath();
        ctx.moveTo(guard.x, guard.y);
        ctx.lineTo(guard.x + (dragStart.x - dragCurrent.x), guard.y + (dragStart.y - dragCurrent.y));
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      // Президент (В костюме с галстуком)
      ctx.beginPath();
      ctx.arc(president.x, president.y, president.r, 0, Math.PI * 2);
      ctx.fillStyle = president.hit ? '#7f1d1d' : '#15803d';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
      // Текст MR. PRESIDENT
      ctx.fillStyle = '#fff';
      ctx.font = '10px sans-serif';
      ctx.fillText('PRESIDENT', president.x - 24, president.y + 30);

      // Телохранитель (В черном)
      ctx.beginPath();
      ctx.arc(guard.x, guard.y, guard.r, 0, Math.PI * 2);
      ctx.fillStyle = '#1e293b';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#38bdf8';
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.fillText('BODYGUARD', guard.x - 28, guard.y + 32);

      // Пуля (с огненным шлейфом)
      if (bullet.active) {
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.r, 0, Math.PI * 2);
        ctx.fillStyle = '#facc15';
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(bullet.x, bullet.y);
        ctx.lineTo(bullet.x - bullet.vx * 3, bullet.y - bullet.vy * 3);
        ctx.strokeStyle = '#f97316';
        ctx.lineWidth = 4;
        ctx.stroke();
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // Старт игры
    titleEl.innerText = "GET DOWN MR. PRESIDENT!";
    descEl.innerText = "Снайпер целится в президента! Оттяните телохранителя и отпустите, чтобы совершить прыжок и закрыть президента собой!";
    mainBtn.innerText = "ИГРАТЬ";
    overlayEl.classList.remove('hidden');

    loop();
  </script>
</body>
</html>
