<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mr. President! Realistic Ragdoll Edition</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- 3D Physics Engine (Three.js & Cannon.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: 'Montserrat', sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0; left: 0;
    }

    #rotate-hint {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #090d16;
      z-index: 999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    #rotate-hint svg {
      width: 70px;
      height: 70px;
      margin-bottom: 15px;
      animation: rotateAnim 2s infinite ease-in-out;
    }
    @keyframes rotateAnim {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
    }
    @media screen and (orientation: portrait) {
      #rotate-hint { display: flex; }
    }

    .ui-top {
      position: absolute;
      top: 12px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    .badge {
      background: #dc2626;
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      font-style: italic;
      padding: 6px 14px;
      transform: skew(-12deg);
      box-shadow: 3px 3px 0px #000;
      border: 2px solid #fff;
      text-transform: uppercase;
    }
    .badge-blue { background: #2563eb; }
    .badge-yellow { background: #f59e0b; color: #000; }

    #joystick-zone {
      position: absolute;
      bottom: 25px;
      left: 25px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.4);
      z-index: 20;
    }
    #joystick-stick {
      position: absolute;
      top: 35px;
      left: 35px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    #dive-btn {
      position: absolute;
      bottom: 30px;
      right: 30px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #dc2626;
      border: 4px solid #fff;
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      font-style: italic;
      box-shadow: 4px 4px 0px #000;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
    }
    #dive-btn:active {
      transform: scale(0.92);
      background: #b91c1c;
    }

    .game-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 8, 15, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      backdrop-filter: blur(4px);
    }
    .screen-title {
      font-size: 28px;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      padding: 8px 24px;
      transform: skew(-10deg);
      box-shadow: 5px 5px 0px #000;
      margin-bottom: 12px;
      border: 3px solid #fff;
    }
    .title-win { background: #16a34a; color: #fff; }
    .title-fail { background: #dc2626; color: #fff; }
    .title-start { background: #2563eb; color: #fff; }

    .screen-desc {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #cbd5e1;
      max-width: 440px;
      text-align: center;
      line-height: 1.3;
    }
    .btn-action {
      background: #f59e0b;
      color: #000;
      border: 3px solid #fff;
      padding: 12px 36px;
      font-size: 18px;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      transform: skew(-10deg);
      box-shadow: 4px 4px 0px #000;
      cursor: pointer;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="rotate-hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><path d="M12 8v8"></path></svg>
    <p style="font-weight: 900; font-size: 18px; color: #fff;">ПЕРЕВЕРНИТЕ ТЕЛЕФОН</p>
    <p style="font-size: 12px; color: #94a3b8; margin-top: 5px;">Включите альбомный режим для игры</p>
  </div>

  <div id="canvas-container"></div>

  <div class="ui-top">
    <div class="badge badge-blue" id="level-text">LEVEL 1</div>
    <div class="badge badge-yellow" id="timer-display">3.5s</div>
    <div class="badge" id="score-text">SAVED: 0</div>
  </div>

  <div id="joystick-zone">
    <div id="joystick-stick"></div>
  </div>
  <div id="dive-btn">DIVE &<br>SAVE!</div>

  <div id="overlay-screen" class="game-screen">
    <div class="screen-title title-start" id="screen-title">MR. PRESIDENT!</div>
    <p class="screen-desc" id="screen-desc">Бегите джойстиком, ломайте ящики и нажимайте DIVE, чтобы сбить Рональда Рампа с ног и заслонить его от пули!</p>
    <button class="btn-action" id="main-btn" onclick="startOrRetry()">START GAME</button>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.requestLandscape) tg.requestLandscape();
    }

    let scene, camera, renderer, world;
    let currentLevel = 1, wins = 0;
    let gameState = 'START';
    let countdown = 3.5;
    let timeScale = 1.0;

    let rumpMesh, rumpBody;
    let guardMesh, guardBody;
    let bulletMesh, bulletBody;
    let sniperLine;
    let destructibles = [];

    let moveInput = { x: 0, z: 0 };
    let isDiving = false;
    let isRumpFallen = false;

    // Физический материал с трением и отскоком для коробок и тел
    let physicsMaterial;

    function initGame() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0f1d);
      scene.fog = new THREE.FogExp2(0x0a0f1d, 0.012);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(12, 25, 12);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      scene.add(dirLight);

      world = new CANNON.World();
      world.gravity.set(0, -9.82, 0);

      physicsMaterial = new CANNON.Material('slippery');
      const contactMat = new CANNON.ContactMaterial(physicsMaterial, physicsMaterial, {
        friction: 0.1,
        restitution: 0.4
      });
      world.addContactMaterial(contactMat);

      createStaticEnvironment();
      setupControls();
      loadLevel(currentLevel);

      animate();
    }

    function createStaticEnvironment() {
      const floorGeo = new THREE.PlaneGeometry(40, 50);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.6 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: physicsMaterial });
      floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
      world.addBody(floorBody);

      const carpetGeo = new THREE.PlaneGeometry(6, 40);
      const carpetMat = new THREE.MeshStandardMaterial({ color: 0x991b1b });
      const carpet = new THREE.Mesh(carpetGeo, carpetMat);
      carpet.rotation.x = -Math.PI / 2;
      carpet.position.set(0, 0.01, -2);
      scene.add(carpet);

      const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
      const laserMat = new THREE.LineBasicMaterial({ color: 0xef4444, linewidth: 3 });
      sniperLine = new THREE.Line(laserGeo, laserMat);
      scene.add(sniperLine);
    }

    function createRump(x, z) {
      const group = new THREE.Group();

      const bodyGeo = new THREE.CylinderGeometry(0.35, 0.35, 1.3, 12);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1d4ed8 });
      const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
      bodyMesh.position.y = 0.65;
      bodyMesh.castShadow = true;
      group.add(bodyMesh);

      const tieGeo = new THREE.BoxGeometry(0.12, 0.7, 0.05);
      const tieMat = new THREE.MeshBasicMaterial({ color: 0xdc2626 });
      const tieMesh = new THREE.Mesh(tieGeo, tieMat);
      tieMesh.position.set(0, 0.7, 0.36);
      group.add(tieMesh);

      const headGeo = new THREE.SphereGeometry(0.28, 12, 12);
      const headMat = new THREE.MeshStandardMaterial({ color: 0xfde047 });
      const headMesh = new THREE.Mesh(headGeo, headMat);
      headMesh.position.y = 1.45;
      headMesh.scale.set(1.1, 0.85, 1.2);
      headMesh.castShadow = true;
      group.add(headMesh);

      scene.add(group);

      const shape = new CANNON.Box(new CANNON.Vec3(0.35, 0.7, 0.35));
      rumpBody = new CANNON.Body({ mass: 45, shape, material: physicsMaterial });
      rumpBody.position.set(x, 0.7, z);
      
      // Запрещаем вращение по умолчанию для вертикальной стойки
      rumpBody.fixedRotation = true;
      rumpBody.updateMassProperties();
      world.addBody(rumpBody);

      rumpMesh = group;
      isRumpFallen = false;

      // Обработка столкновения телохранителя с Рампом
      rumpBody.addEventListener('collide', (e) => {
        if (e.body === guardBody && !isRumpFallen) {
          isRumpFallen = true;
          rumpBody.fixedRotation = false; // Включаем падение от физики
          rumpBody.updateMassProperties();

          const dirX = rumpBody.position.x - guardBody.position.x;
          const dirZ = rumpBody.position.z - guardBody.position.z;
          rumpBody.applyImpulse(new CANNON.Vec3(dirX * 15, 8, dirZ * 15), rumpBody.position);
          rumpBody.angularVelocity.set(Math.random() * 10, Math.random() * 10, Math.random() * 10);
        }
      });
    }

    function createGuard(x, z) {
      const group = new THREE.Group();

      const bodyGeo = new THREE.BoxGeometry(0.95, 1.4, 0.55);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x090d16 });
      const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
      bodyMesh.position.y = 0.7;
      bodyMesh.castShadow = true;
      group.add(bodyMesh);

      const headGeo = new THREE.SphereGeometry(0.3, 12, 12);
      const headMat = new THREE.MeshStandardMaterial({ color: 0xf87171 });
      const headMesh = new THREE.Mesh(headGeo, headMat);
      headMesh.position.y = 1.5;

      const glassesGeo = new THREE.BoxGeometry(0.4, 0.1, 0.15);
      const glassesMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
      const glassesMesh = new THREE.Mesh(glassesGeo, glassesMat);
      glassesMesh.position.set(0, 1.55, 0.22);
      group.add(headMesh);
      group.add(glassesMesh);

      scene.add(group);

      const shape = new CANNON.Box(new CANNON.Vec3(0.48, 0.7, 0.28));
      guardBody = new CANNON.Body({ mass: 120, shape, material: physicsMaterial });
      guardBody.position.set(x, 0.7, z);
      guardBody.fixedRotation = true;
      world.addBody(guardBody);

      guardMesh = group;
    }

    function spawnBlock(x, y, z, w, h, d, color = 0xd97706) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({ color });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);

      const shape = new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2));
      const body = new CANNON.Body({ mass: 8, shape, material: physicsMaterial });
      body.position.set(x, y, z);
      world.addBody(body);

      destructibles.push({ mesh, body });

      // Толчок ящику при ударе
      body.addEventListener('collide', (e) => {
        if (e.body === guardBody) {
          const forceX = (body.position.x - guardBody.position.x) * 12;
          const forceZ = (body.position.z - guardBody.position.z) * 12;
          body.applyImpulse(new CANNON.Vec3(forceX, 4, forceZ), body.position);
        }
      });
    }

    function loadLevel(lvl) {
      if (rumpMesh) { scene.remove(rumpMesh); world.remove(rumpBody); }
      if (guardMesh) { scene.remove(guardMesh); world.remove(guardBody); }
      if (bulletMesh) { scene.remove(bulletMesh); world.remove(bulletBody); }
      destructibles.forEach(obj => { scene.remove(obj.mesh); world.remove(obj.body); });
      destructibles = [];

      isDiving = false;
      timeScale = 1.0;
      countdown = Math.max(2.2, 4.0 - lvl * 0.3).toFixed(1);

      createRump(0, -5);
      createGuard(0, 6);

      if (lvl === 1) {
        spawnBlock(0, 0.5, -3.5, 2.5, 1.0, 0.8, 0xb45309);
        spawnBlock(-1.8, 0.6, -2, 1.0, 1.2, 1.0, 0x1e3a8a);
        spawnBlock(1.8, 0.6, -2, 1.0, 1.2, 1.0, 0x1e3a8a);
      } else if (lvl === 2) {
        for (let i = -2; i <= 2; i += 1.1) {
          for (let j = 0.5; j <= 2.5; j += 0.9) {
            spawnBlock(i, j, 1, 1.0, 0.8, 0.8, 0x78350f);
          }
        }
      } else {
        for (let i = -3; i <= 3; i += 1.4) {
          spawnBlock(i, 0.6, 2, 1.2, 1.2, 0.8, 0xd97706);
          spawnBlock(i, 0.6, -1, 1.2, 1.2, 0.8, 0xd97706);
        }
      }

      document.getElementById('level-text').innerText = `LEVEL ${lvl}`;
      gameState = 'PLAYING';
    }

    function setupControls() {
      const stick = document.getElementById('joystick-stick');
      const zone = document.getElementById('joystick-zone');
      const diveBtn = document.getElementById('dive-btn');

      let touchId = null;
      let center = { x: 0, y: 0 };

      zone.addEventListener('touchstart', (e) => {
        const touch = e.changedTouches[0];
        touchId = touch.identifier;
        const rect = zone.getBoundingClientRect();
        center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      });

      window.addEventListener('touchmove', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === touchId) {
            const touch = e.changedTouches[i];
            const dx = touch.clientX - center.x;
            const dy = touch.clientY - center.y;
            const dist = Math.min(Math.hypot(dx, dy), 40);
            const angle = Math.atan2(dy, dx);

            stick.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
            moveInput.x = (Math.cos(angle) * dist) / 40;
            moveInput.z = (Math.sin(angle) * dist) / 40;
          }
        }
      });

      const resetStick = (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === touchId) {
            touchId = null;
            stick.style.transform = `translate(0px, 0px)`;
            moveInput = { x: 0, z: 0 };
          }
        }
      };

      window.addEventListener('touchend', resetStick);
      window.addEventListener('touchcancel', resetStick);

      diveBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        performDive();
      });
      diveBtn.addEventListener('mousedown', performDive);
    }

    function performDive() {
      if (gameState !== 'PLAYING' || isDiving) return;
      isDiving = true;

      // Снимаем ограничение вращения при прыжке
      guardBody.fixedRotation = false;
      guardBody.updateMassProperties();

      const forwardX = moveInput.x !== 0 ? moveInput.x * 25 : 0;
      const forwardZ = moveInput.z !== 0 ? moveInput.z * 25 : -28;

      guardBody.velocity.set(forwardX, 12, forwardZ);
      guardBody.angularVelocity.set(Math.random() * 8, Math.random() * 8, Math.random() * 8);

      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
    }

    function shootBullet() {
      gameState = 'SHOT';

      const bulletGeo = new THREE.SphereGeometry(0.18, 8, 8);
      const bulletMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
      bulletMesh = new THREE.Mesh(bulletGeo, bulletMat);
      scene.add(bulletMesh);

      const sniperPos = new THREE.Vector3(10, 8, -18);
      const targetPos = rumpMesh.position.clone();
      const dir = targetPos.clone().sub(sniperPos).normalize();

      bulletBody = new CANNON.Body({ mass: 0.1, shape: new CANNON.Sphere(0.18) });
      bulletBody.position.set(sniperPos.x, sniperPos.y, sniperPos.z);
      bulletBody.velocity.set(dir.x * 40, dir.y * 40, dir.z * 40);
      world.addBody(bulletBody);
    }

    function updatePhysics() {
      const dt = (1 / 60) * timeScale;
      world.step(dt);

      if (gameState === 'PLAYING' && !isDiving) {
        guardBody.velocity.x = moveInput.x * 12;
        guardBody.velocity.z = moveInput.z * 12;
      }

      rumpMesh.position.copy(rumpBody.position);
      rumpMesh.quaternion.copy(rumpBody.quaternion);

      guardMesh.position.copy(guardBody.position);
      guardMesh.quaternion.copy(guardBody.quaternion);

      destructibles.forEach(d => {
        d.mesh.position.copy(d.body.position);
        d.mesh.quaternion.copy(d.body.quaternion);
      });

      camera.position.x = guardMesh.position.x * 0.5;
      camera.position.y = 5 + guardMesh.position.y * 0.2;
      camera.position.z = guardMesh.position.z + 8;
      camera.lookAt(rumpMesh.position.x, 1.5, rumpMesh.position.z);

      if (bulletMesh && bulletBody) {
        bulletMesh.position.copy(bulletBody.position);

        if (bulletMesh.position.distanceTo(guardMesh.position) < 1.2) {
          winStage("ВЫ СЕЛИ НА ПУЛЮ И СПАСЛИ РАМПА!");
          return;
        }

        if (bulletMesh.position.distanceTo(rumpMesh.position) < 0.9) {
          failStage("ПРЕЗИДЕНТ РАМП БЫЛ УБИТ!");
          return;
        }
      }

      if (gameState === 'PLAYING') {
        const sniperPos = new THREE.Vector3(10, 8, -18);
        sniperLine.geometry.setFromPoints([sniperPos, rumpMesh.position]);
      } else {
        sniperLine.visible = false;
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      if (gameState === 'PLAYING') {
        countdown -= 1 / 60;
        document.getElementById('timer-display').innerText = Math.max(0, countdown).toFixed(1) + "s";

        if (countdown <= 1.0) timeScale = 0.3;

        if (countdown <= 0) {
          shootBullet();
        }
      }

      updatePhysics();
      renderer.render(scene, camera);
    }

    function winStage(msg) {
      gameState = 'WIN';
      wins++;
      document.getElementById('score-text').innerText = `SAVED: ${wins}`;
      document.getElementById('screen-title').innerText = "LEVEL CLEAR!";
      document.getElementById('screen-title').className = "screen-title title-win";
      document.getElementById('screen-desc').innerText = msg;
      document.getElementById('main-btn').innerText = "NEXT LEVEL";
      document.getElementById('overlay-screen').classList.remove('hidden');
    }

    function failStage(msg) {
      gameState = 'FAIL';
      document.getElementById('screen-title').innerText = "ASSASSINATED!";
      document.getElementById('screen-title').className = "screen-title title-fail";
      document.getElementById('screen-desc').innerText = msg;
      document.getElementById('main-btn').innerText = "TRY AGAIN";
      document.getElementById('overlay-screen').classList.remove('hidden');
    }

    function startOrRetry() {
      document.getElementById('overlay-screen').classList.add('hidden');
      if (gameState === 'WIN') currentLevel++;
      loadLevel(currentLevel);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.onload = initGame;
  </script>
</body>
</html>
